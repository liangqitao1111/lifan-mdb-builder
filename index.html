<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>理反 Web · 理正地层复核数据管理平台</title>
<style>
/* ============================================================
   理反 Web · 全新皮肤 v2 "Strata"（地层）
   深色岩层侧边栏 · 石灰画布 · 琥珀主色 · 等宽数字
   仅视觉层重写，所有 class 名 / DOM 结构 / 业务逻辑不变
   ============================================================ */
:root {
  /* 主色：琥珀铜（岩土/钻探气质），深色按钮，亮色只做高光 */
  --primary: #b45309;
  --primary-pressed: #92400e;
  --primary-bright: #f59e0b;
  --primary-glow: rgba(245,158,11,.35);
  --primary-soft: rgba(180,83,9,.08);

  /* 画布：暖石灰纸面 */
  --canvas: #f4f2ed;
  --surface: #ebe8e1;
  --surface-soft: #f9f8f4;
  --card: #fffdf9;
  --hairline: #e0dcd2;
  --hairline-strong: #c9c3b5;

  /* 墨色文字阶 */
  --ink: #1c1917;
  --charcoal: #44403c;
  --slate: #6b655c;
  --steel: #8a857a;
  --muted: #b3ada0;

  /* 深色岩层面（侧栏 / 登录品牌区 / banner） */
  --navy: #211d18;
  --navy-2: #2c2721;
  --on-dark: #f5f2ea;
  --on-dark-muted: #a39c8d;
  --on-dark-line: rgba(245,242,234,.1);

  /* 语义色（收敛的矿物色） */
  --success: #3f8f5f;
  --warning: #d97706;
  --error: #dc2626;
  --info: #0f766e;
  --tint-mint: #e3f0e8;
  --tint-yellow: #f8ecd8;
  --tint-sky: #e2ecec;
  --tint-lavender: #eeeae2;
  --tint-peach: #f5e4d4;
  --tint-info: #e2ecec;
  --tint-yellow-bold: #f59e0b;

  --space-1: 4px;  --space-2: 8px;  --space-3: 12px;  --space-4: 16px;
  --space-5: 20px; --space-6: 24px; --space-7: 28px;  --space-8: 32px;
  --fs-xs: 11px;  --fs-sm: 12px;  --fs-base: 13px; --fs-md: 14px;
  --fs-lg: 16px;  --fs-xl: 20px;  --fs-2xl: 26px;  --fs-3xl: 32px;
  --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px; --radius-xl: 18px; --radius-2xl: 22px;
  --radius-pill: 999px;
  --shadow-1: 0 1px 2px rgba(28,25,23,.05), 0 3px 10px rgba(28,25,23,.05);
  --shadow-2: 0 8px 24px rgba(28,25,23,.1), 0 2px 6px rgba(28,25,23,.06);
  --shadow-3: 0 20px 52px rgba(28,25,23,.16), 0 3px 10px rgba(28,25,23,.08);
  --shadow-card: var(--shadow-1);
  --ease: cubic-bezier(.2,.7,.2,1);
  --t-fast: .15s; --t-mid: .24s;
  --font-num: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
}
:root[data-theme="dark"] {
  --canvas: #16130f;
  --surface: #211d18;
  --surface-soft: #2a251f;
  --card: #1e1a15;
  --hairline: #37322a;
  --hairline-strong: #4a443a;
  --ink: #f0ece3;
  --charcoal: #d6d0c4;
  --slate: #a39c8d;
  --steel: #8a857a;
  --muted: #6b655c;
  --navy: #100d0a;
  --navy-2: #1a1712;
  --on-dark: #f5f2ea;
  --on-dark-muted: #8a857a;
  --on-dark-line: rgba(245,242,234,.08);
  --primary: #f59e0b;
  --primary-pressed: #d97706;
  --primary-bright: #fbbf24;
  --primary-soft: rgba(245,158,11,.14);
  --tint-mint: #15251c;
  --tint-yellow: #2b2110;
  --tint-sky: #14211f;
  --tint-lavender: #26221c;
  --tint-peach: #2b1d10;
  --tint-info: #14211f;
  --shadow-1: 0 1px 2px rgba(0,0,0,.4), 0 3px 10px rgba(0,0,0,.35);
  --shadow-2: 0 8px 24px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.4);
  --shadow-3: 0 20px 52px rgba(0,0,0,.6), 0 3px 10px rgba(0,0,0,.45);
  --shadow-card: var(--shadow-1);
}
:root[data-theme="dark"] .login-brand { background: var(--navy); }

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; color: var(--ink); background: var(--canvas); -webkit-font-smoothing: antialiased; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }
input, select, textarea { font-family: inherit; font-size: 14px; color: var(--ink); }
a { color: var(--primary); text-decoration: none; }
a:hover { text-decoration: underline; }
::selection { background: rgba(245,158,11,.28); }

/* ============ 登录页：左岩层 · 右纸面 ============ */
.login-wrap { display: flex; min-height: 100vh; }
.login-brand {
  flex: 0 0 660px; padding: 64px; color: var(--on-dark); display: flex; flex-direction: column; gap: 20px;
  background:
    radial-gradient(900px 500px at 110% -10%, rgba(245,158,11,.14), transparent 60%),
    radial-gradient(600px 600px at -20% 110%, rgba(245,158,11,.07), transparent 55%),
    linear-gradient(160deg, #26211b 0%, var(--navy) 55%, #171310 100%);
  position: relative; overflow: hidden;
}
.login-brand::after { /* 地层纹理：水平沉积线 */
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5;
  background: repeating-linear-gradient(180deg, transparent 0 46px, rgba(245,242,234,.035) 46px 47px);
}
.login-brand > * { position: relative; z-index: 1; }
.login-brand .logo { display: flex; align-items: center; gap: 12px; }
.login-brand .logo-box {
  width: 38px; height: 38px; border-radius: 10px; color: #221a08; font-weight: 800; font-size: 20px;
  background: linear-gradient(135deg, #fbbf24, #d97706); box-shadow: 0 6px 16px rgba(217,119,6,.4);
  display: flex; align-items: center; justify-content: center;
}
.login-brand .logo-text { font-size: 20px; font-weight: 700; letter-spacing: .5px; }
.login-brand .badge {
  display: inline-block; padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; width: max-content;
  color: var(--primary-bright); background: rgba(245,158,11,.12); border: 1px solid rgba(245,158,11,.35); letter-spacing: .5px;
}
.login-brand h1 { font-size: 44px; font-weight: 800; line-height: 1.22; max-width: 480px; letter-spacing: -.5px; }
.login-brand .sub { color: var(--on-dark-muted); font-size: 15px; line-height: 1.7; max-width: 460px; }
.login-brand .features { display: flex; flex-direction: column; gap: 16px; margin-top: 28px; }
.login-brand .feat-row {
  display: flex; align-items: center; gap: 14px; font-size: 14px; color: var(--on-dark);
  background: rgba(245,242,234,.04); border: 1px solid var(--on-dark-line); border-radius: 14px; padding: 13px 16px;
  backdrop-filter: blur(4px); transition: all var(--t-mid) var(--ease);
}
.login-brand .feat-row:hover { background: rgba(245,242,234,.07); transform: translateX(4px); }
.login-brand .feat-row svg { flex: 0 0 24px; }
.login-form-area { flex: 1; display: flex; align-items: center; justify-content: center; padding: 48px; background: var(--canvas); }
.login-form { width: 400px; display: flex; flex-direction: column; gap: 10px; }
.login-form h2 { font-size: 30px; font-weight: 800; margin-bottom: 2px; letter-spacing: -.5px; }
.login-form .form-sub { color: var(--steel); font-size: 14px; margin-bottom: 16px; }
.login-form label { font-size: 13px; font-weight: 600; color: var(--charcoal); }
.login-form .input {
  display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px;
  border: 1.5px solid var(--hairline-strong); border-radius: var(--radius-md); background: var(--card);
  transition: all var(--t-fast) var(--ease);
}
.login-form .input:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3.5px rgba(180,83,9,.14); }
.login-form .input input { border: none; outline: none; flex: 1; background: transparent; }
.login-form .input svg { flex: 0 0 20px; color: var(--steel); }
.login-form .opts { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
.login-form .opts .chk { display: flex; align-items: center; gap: 8px; color: var(--slate); }
.login-form .opts .chk-box { width: 16px; height: 16px; border-radius: 5px; background: var(--primary); display: flex; align-items: center; justify-content: center; color: #fff; }
.login-form .opts .forgot { color: var(--primary); font-weight: 600; }
.login-form .btn-login {
  height: 48px; background: var(--ink); color: var(--on-dark); border-radius: var(--radius-md);
  font-size: 15px; font-weight: 700; margin-top: 8px; letter-spacing: 4px; transition: all var(--t-fast) var(--ease);
}
.login-form .btn-login:hover { background: var(--primary); color: #fff; box-shadow: 0 8px 20px var(--primary-glow); transform: translateY(-1px); }
.login-form .hint { text-align: center; color: var(--steel); font-size: 12px; margin-top: 6px; }
.login-form .err { color: var(--error); font-size: 12px; min-height: 16px; }

/* ============ 应用骨架：深色岩层侧边栏 ============ */
.app { display: none; min-height: 100vh; }
.app.show { display: flex; }
.sidebar {
  flex: 0 0 236px; padding: 20px 12px; display: flex; flex-direction: column; gap: 3px;
  background: linear-gradient(180deg, var(--navy-2) 0%, var(--navy) 40%);
  border-right: 1px solid rgba(0,0,0,.35);
  transition: flex-basis .25s var(--ease); position: relative;
}
.sidebar.collapsed { flex-basis: 60px; }
.sidebar.collapsed .sb-name,
.sidebar.collapsed .nav-text,
.sidebar.collapsed .sb-section,
.sidebar.collapsed .sb-toggle-label { display: none; }
.sidebar.collapsed .sb-head { justify-content: center; padding: 0 0 14px; }
.sidebar.collapsed .nav-item { justify-content: center; padding: 0; }
.sidebar.collapsed .nav-item.active::before { left: 0; top: 6px; bottom: 6px; width: 100%; border-radius: 10px; background: linear-gradient(90deg, rgba(245,158,11,.18), rgba(245,158,11,.06)); box-shadow: none; }
.sidebar.collapsed:hover { flex-basis: 236px; box-shadow: 12px 0 32px rgba(0,0,0,.25); z-index: 10; }
.sidebar.collapsed:hover .nav-item.active::before { left: -12px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: linear-gradient(180deg, #fbbf24, #d97706); box-shadow: 0 0 10px var(--primary-glow); }
.sidebar.collapsed:hover .sb-name,
.sidebar.collapsed:hover .nav-text,
.sidebar.collapsed:hover .sb-section,
.sidebar.collapsed:hover .sb-toggle-label { display: inline; }
.sidebar.collapsed:hover .sb-head { justify-content: flex-start; padding: 0 14px 14px; }
.sidebar.collapsed:hover .nav-item { justify-content: flex-start; padding: 0 12px; }
.sb-toggle {
  position: absolute; right: -13px; top: 20px; width: 26px; height: 26px; border-radius: 50%;
  background: var(--card); border: 1px solid var(--hairline-strong); color: var(--slate);
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  box-shadow: var(--shadow-1); z-index: 11; transition: all .15s;
}
.sb-toggle:hover { color: var(--primary); border-color: var(--primary); transform: scale(1.1); }
.sidebar.collapsed .sb-toggle svg { transform: rotate(0deg); }
.sidebar:not(.collapsed) .sb-toggle svg { transform: rotate(180deg); }
.sb-toggle svg { transition: transform .25s var(--ease); }
.sidebar .sb-head { display: flex; align-items: center; gap: 10px; padding: 0 12px 14px; border-bottom: 1px solid var(--on-dark-line); margin-bottom: 10px; }
.sidebar .sb-logo {
  width: 30px; height: 30px; border-radius: 9px; color: #221a08; font-weight: 800; font-size: 16px;
  background: linear-gradient(135deg, #fbbf24, #d97706); box-shadow: 0 4px 10px rgba(217,119,6,.35);
  display: flex; align-items: center; justify-content: center; flex: 0 0 30px;
}
.sidebar .sb-name { font-size: 15.5px; font-weight: 700; color: var(--on-dark); letter-spacing: .3px; }
.sidebar .sb-section {
  padding: 14px 14px 5px; font-size: 10.5px; font-weight: 700; color: var(--on-dark-muted);
  letter-spacing: 1.6px; text-transform: uppercase;
}
.nav-item {
  display: flex; align-items: center; gap: 11px; height: 38px; margin: 1px 0; padding: 0 12px;
  border-radius: 10px; color: var(--on-dark-muted); font-size: 13.5px; font-weight: 500; cursor: pointer;
  transition: all var(--t-fast) var(--ease); position: relative;
}
.nav-item:hover { background: rgba(245,242,234,.06); color: var(--on-dark); }
.nav-item.active {
  background: linear-gradient(90deg, rgba(245,158,11,.18), rgba(245,158,11,.06));
  color: var(--primary-bright); font-weight: 700;
}
.nav-item.active::before {
  content: ""; position: absolute; left: -12px; top: 8px; bottom: 8px; width: 3px;
  border-radius: 0 3px 3px 0; background: linear-gradient(180deg, #fbbf24, #d97706);
  box-shadow: 0 0 10px var(--primary-glow);
}
.nav-item svg { flex: 0 0 22px; }

/* ============ 主区 & 顶栏 ============ */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.topbar {
  height: 60px; background: var(--card); border-bottom: 1px solid var(--hairline);
  display: flex; align-items: center; justify-content: space-between; padding: 0 28px; gap: 16px;
}
.topbar .crumb { font-size: 15px; font-weight: 700; letter-spacing: -.2px; }
.topbar .crumb::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; background: var(--primary); margin-right: 10px; transform: rotate(45deg); }
.topbar .search {
  display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; width: 340px;
  background: var(--surface); border: 1px solid transparent; border-radius: 999px; transition: all var(--t-fast) var(--ease);
}
.topbar .search input { background: transparent; border: none; outline: none; flex: 1; font-size: 13px; }
.topbar .user-area { display: flex; align-items: center; gap: 10px; }
.topbar .avatar {
  display: flex; align-items: center; gap: 9px; padding: 0 13px 0 4px; height: 36px;
  background: var(--surface); border: 1px solid var(--hairline); border-radius: 999px;
}
.topbar .avatar .av-img {
  width: 28px; height: 28px; border-radius: 50%; color: #fff; font-weight: 700; font-size: 12px;
  background: linear-gradient(135deg, #78716c, #44403c);
  display: flex; align-items: center; justify-content: center;
}
.topbar .avatar span { font-size: 13px; font-weight: 600; color: var(--charcoal); }
.topbar .bell {
  width: 36px; height: 36px; background: var(--surface); border: 1px solid var(--hairline);
  border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--slate);
  transition: all var(--t-fast) var(--ease);
}
.topbar .bell:hover { color: var(--primary); border-color: var(--primary); }

.content { flex: 1; padding: 26px 28px 40px; overflow-y: auto; }
.content h1.page-title { font-size: 26px; font-weight: 800; margin-bottom: 6px; letter-spacing: -.5px; }
.content .page-sub { color: var(--steel); font-size: 13px; margin-bottom: 20px; }

/* ==== 全站统一页头（与工作台一致：眉题 + 大标题 + 副信息 + 右侧操作） ==== */
.pg-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 22px; }
.pg-eyebrow { font-size: 11.5px; font-weight: 800; color: var(--primary); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; display: inline-flex; align-items: center; gap: 9px; }
.pg-eyebrow::before { content: ""; width: 20px; height: 2px; border-radius: 1px; background: var(--primary); }
.pg-title { font-size: 30px; font-weight: 800; letter-spacing: -.8px; line-height: 1.08; }
.pg-sub { color: var(--slate); font-size: 13.5px; margin-top: 6px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pg-actions { display: flex; gap: 10px; }

/* 通用统计横条（复用 ws-stats 横条语言，供 build/工具页使用） */
.stat-strip { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--card); border: 1px solid var(--hairline); border-radius: var(--radius-xl); box-shadow: var(--shadow-card); overflow: hidden; margin-bottom: 20px; }
.stat-strip .cell { padding: 16px 20px; display: flex; flex-direction: column; gap: 3px; position: relative; }
.stat-strip .cell + .cell { border-left: 1px solid var(--hairline); }
.stat-strip .k { font-size: 11.5px; font-weight: 700; color: var(--steel); letter-spacing: .6px; text-transform: uppercase; }
.stat-strip .v { font-size: 24px; font-weight: 800; font-family: var(--font-num); letter-spacing: -.5px; color: var(--ink); }
.stat-strip .v.ok { color: var(--success); } .stat-strip .v.warn { color: var(--warning); } .stat-strip .v.err { color: var(--error); }
.stat-strip .s { font-size: 11.5px; color: var(--muted); }

/* 区块标题（面板组上方的小节标题） */
.sec-title { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 800; color: var(--charcoal); letter-spacing: .3px; margin: 4px 0 14px; }
.sec-title::before { content: ""; width: 4px; height: 15px; border-radius: 2px; background: linear-gradient(180deg, var(--primary-bright), var(--primary)); }
.sec-title .cnt { font-size: 11px; font-weight: 600; color: var(--steel); background: var(--surface); border: 1px solid var(--hairline); border-radius: 999px; padding: 2px 9px; }

/* ============ 通用卡片 / 按钮 ============ */
.card { background: var(--card); border: 1px solid var(--hairline); border-radius: var(--radius-lg); padding: 22px; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 37px; padding: 0 17px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all var(--t-fast) var(--ease); }
.btn-primary { background: var(--ink); color: var(--on-dark); box-shadow: var(--shadow-1); }
.btn-primary:hover { background: var(--primary); color: #fff; box-shadow: 0 6px 16px var(--primary-glow); transform: translateY(-1px); }
.btn-primary:disabled { opacity: .55; pointer-events: none; }
.btn-secondary { background: var(--card); color: var(--charcoal); border: 1px solid var(--hairline-strong); }
.btn-secondary:hover { border-color: var(--primary); color: var(--primary); transform: translateY(-1px); }
.btn-danger { color: var(--error); background: var(--card); border: 1px solid var(--hairline-strong); }
.btn-danger:hover { border-color: var(--error); }
.btn-link { color: var(--primary); font-weight: 600; }

/* ============ 统计卡（通用 stat-row / 旧页沿用） ============ */
.stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
.stat-card { background: var(--card); border: 1px solid var(--hairline); border-radius: var(--radius-xl); padding: 22px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow-card); }
.stat-card .stat-head { display: flex; justify-content: space-between; align-items: center; }
.stat-card .stat-head .label { font-size: 13px; font-weight: 600; color: var(--steel); }
.stat-card .stat-head .ic { width: 32px; height: 32px; border-radius: 9px; display: flex; align-items: center; justify-content: center; }
.stat-card .val { font-size: 30px; font-weight: 800; color: var(--ink); font-family: var(--font-num); letter-spacing: -.5px; }
.stat-card .sub { font-size: 12px; color: var(--steel); }
.stat-card .sub.ok { color: var(--success); }

.welcome { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.welcome .welcome-r { display: flex; gap: 10px; }

/* ============ 工具条 / 表格（旧页沿用） ============ */
.toolbar { background: var(--surface); border-radius: var(--radius-lg); padding: 6px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 12px; height: 56px; }
.tabs { display: flex; height: 100%; }
.tab { display: flex; align-items: center; padding: 0 14px; height: 100%; color: var(--slate); font-size: 13px; cursor: pointer; }
.tab.active { color: var(--ink); font-weight: 700; border-bottom: 2.5px solid var(--primary); }
.tab:hover { color: var(--ink); }
.t-tools { display: flex; gap: 10px; align-items: center; }
.search-in { display: flex; align-items: center; gap: 6px; width: 240px; height: 38px; padding: 0 10px; background: var(--card); border: 1px solid var(--hairline-strong); border-radius: var(--radius-md); }
.search-in input { border: none; outline: none; flex: 1; background: transparent; font-size: 13px; }

.table-card { background: var(--card); border: 1px solid var(--hairline); border-radius: var(--radius-lg); overflow: hidden; }
.t-head, .t-row { display: grid; align-items: center; }
.t-head { background: var(--surface); height: 42px; padding: 0 20px; font-size: 11.5px; font-weight: 700; color: var(--steel); letter-spacing: .3px; }
.t-row { padding: 0 20px; min-height: 48px; border-bottom: 1px solid var(--hairline); font-size: 13px; }
.t-row:last-child { border-bottom: none; }
.t-row .name { font-weight: 600; color: var(--ink); }
.status-pill { display: inline-flex; align-items: center; gap: 5px; padding: 0 10px; height: 24px; border-radius: 999px; font-size: 12px; font-weight: 600; }
.status-pill.ok { background: var(--tint-mint); color: var(--success); }
.status-pill.warn { background: var(--tint-yellow); color: var(--warning); }
.status-pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

.pager { display: flex; justify-content: space-between; align-items: center; height: 56px; padding: 0 20px; background: var(--surface-soft); font-size: 13px; color: var(--steel); }
.pager .pages { display: flex; gap: 4px; }
.pager .pages button { width: 32px; height: 32px; border-radius: 8px; background: var(--card); border: 1px solid var(--hairline-strong); cursor: pointer; color: var(--charcoal); }
.pager .pages button.active { background: var(--ink); color: var(--on-dark); border-color: var(--ink); }

/* ============ Banner（岩层深底 + 琥珀高光） ============ */
.banner {
  color: var(--on-dark); border-radius: var(--radius-xl); padding: 30px 40px; margin-bottom: 20px;
  display: flex; justify-content: space-between; align-items: center;
  background:
    radial-gradient(700px 300px at 105% -30%, rgba(245,158,11,.2), transparent 60%),
    linear-gradient(120deg, var(--navy-2), var(--navy) 70%);
  box-shadow: var(--shadow-2); position: relative; overflow: hidden;
}
.banner::after { content: ""; position: absolute; inset: 0; opacity: .4; pointer-events: none;
  background: repeating-linear-gradient(180deg, transparent 0 38px, rgba(245,242,234,.04) 38px 39px); }
.banner > * { position: relative; z-index: 1; }
.banner h2 { font-size: 27px; font-weight: 800; letter-spacing: -.5px; }
.banner p { color: var(--on-dark-muted); font-size: 13px; max-width: 620px; margin-top: 8px; line-height: 1.65; }
.banner .right { display: flex; align-items: center; gap: 12px; }
.banner .ic-circle {
  width: 56px; height: 56px; border-radius: 16px; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #fbbf24, #d97706); box-shadow: 0 8px 20px rgba(217,119,6,.45);
}

.config-card { background: var(--card); border: 1px solid var(--hairline); border-radius: var(--radius-lg); padding: 24px; margin-bottom: 20px; }
.config-card h3 { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
.formats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
.format { padding: 16px; border-radius: 12px; background: var(--surface-soft); border: 1.5px solid var(--hairline); cursor: pointer; transition: all var(--t-fast) var(--ease); }
.format:hover { border-color: var(--hairline-strong); }
.format.active { background: var(--primary-soft); border-color: var(--primary); }
.format .ft { font-size: 16px; font-weight: 800; margin-bottom: 4px; color: var(--ink); font-family: var(--font-num); }
.format.active .ft { color: var(--primary); }
.format .fs { font-size: 12px; color: var(--slate); }
.main-action { display: flex; justify-content: space-between; align-items: center; background: var(--surface-soft); padding: 20px; border-radius: 12px; }
.main-action .left strong { display: block; font-size: 14px; margin-bottom: 4px; }
.main-action .left p { font-size: 12px; color: var(--steel); }

.banner-status { background: var(--tint-mint); border: 1px solid rgba(63,143,95,.25); border-radius: 14px; padding: 0 28px; height: 90px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.banner-status h3 { color: var(--success); font-size: 17px; font-weight: 700; margin-bottom: 4px; }
.banner-status p { color: var(--charcoal); font-size: 13px; }
.banner-status .right { color: var(--success); font-weight: 700; display: flex; align-items: center; gap: 8px; }

.policy-card { background: var(--card); border: 1px solid var(--hairline); border-radius: var(--radius-lg); padding: 24px; display: flex; gap: 32px; }
.policy-card h3 { font-size: 16px; font-weight: 700; margin-bottom: 14px; }
.switch-row { display: flex; justify-content: space-between; align-items: center; background: var(--surface-soft); padding: 14px; border-radius: 10px; margin-top: 4px; }
.switch-row .switch::after { content: ""; position: absolute; right: 2px; top: 2px; width: 18px; height: 18px; background: #fff; border-radius: 50%; }
.setting-row { display: flex; justify-content: space-between; align-items: center; background: var(--surface-soft); padding: 12px 14px; border-radius: 10px; margin-bottom: 8px; }
.setting-row .lbl { color: var(--slate); font-size: 13px; }
.setting-row .val { font-weight: 700; color: var(--ink); font-size: 13px; }

.users-list { background: var(--card); border: 1px solid var(--hairline); border-radius: var(--radius-lg); padding: 24px; margin-bottom: 20px; }

.matrix { background: var(--card); border: 1px solid var(--hairline); border-radius: var(--radius-lg); padding: 24px; }
.matrix h3 { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
.matrix .m-head, .matrix .m-row { display: grid; align-items: center; }
.matrix .m-head { background: var(--surface); height: 36px; padding: 0 14px; font-size: 12px; font-weight: 700; color: var(--steel); border-radius: 8px; }
.matrix .m-row { padding: 14px; border-radius: 10px; margin-top: 8px; min-height: 56px; font-size: 14px; }
.matrix .m-row.alt { background: var(--surface-soft); }
.matrix .check { display: flex; justify-content: center; }

/* ============ 弹窗 ============ */
.modal-mask { position: fixed; inset: 0; background: rgba(28,25,23,.5); backdrop-filter: blur(3px); display: none; align-items: center; justify-content: center; z-index: 100; }
.modal-mask.show { display: flex; }
.modal { background: var(--card); border-radius: var(--radius-xl); width: 520px; max-width: 90vw; padding: 28px; box-shadow: var(--shadow-3); border: 1px solid var(--hairline); }
.modal h3 { font-size: 18px; font-weight: 800; margin-bottom: 16px; letter-spacing: -.3px; }
.modal .form-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.modal .form-row label { font-size: 12px; font-weight: 600; color: var(--slate); }
.modal .form-row input, .modal .form-row select { height: 38px; padding: 0 12px; border: 1px solid var(--hairline-strong); border-radius: var(--radius-md); outline: none; background: var(--card); }
.modal .form-row input:focus, .modal .form-row select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(180,83,9,.14); }
.modal .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

@media (max-width: 1024px) {
  .login-wrap { flex-direction: column; }
  .login-brand { flex: none; padding: 40px; }
  .login-form-area { padding: 40px; }
  .stat-row { grid-template-columns: repeat(2, 1fr); }
  .formats { grid-template-columns: 1fr; }
  .topbar .search { display: none; }
}
@media (max-width: 720px) {
  .sidebar { display: none; }
  .stat-row { grid-template-columns: 1fr; }
  .topbar { padding: 0 16px; }
  .content { padding: 16px; }
}

.flex { display: flex; gap: 12px; align-items: center; }
.spacer { flex: 1; }
.muted { color: var(--steel); }
.small { font-size: 12px; }
.toast { position: fixed; top: 20px; right: 20px; background: var(--ink); color: var(--on-dark); padding: 12px 20px; border-radius: var(--radius-md); z-index: 200; display: none; box-shadow: var(--shadow-2); }
.toast.show { display: block; }
.toast.err { background: var(--error); color: #fff; }
.toast.ok { background: var(--success); color: #fff; }
.toast.info { background: var(--info); color: #fff; }

.btn { position: relative; }
.btn.loading { color: transparent !important; pointer-events: none; }
.btn.loading::after { content: ""; position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: btn-spin .8s linear infinite; color: #fff; }
.btn-secondary.loading::after { color: var(--primary); }
@keyframes btn-spin { to { transform: rotate(360deg); } }

.skeleton { display: flex; flex-direction: column; gap: 10px; padding: var(--space-4); }
.skeleton .sk-line { height: 14px; border-radius: 6px; background: linear-gradient(90deg, var(--surface) 0%, var(--hairline) 50%, var(--surface) 100%); background-size: 200% 100%; animation: sk-shine 1.4s ease-in-out infinite; }
.skeleton .sk-line.short { width: 40%; }
.skeleton .sk-line.mid { width: 65%; }
.skeleton .sk-line.long { width: 90%; }
.skeleton .sk-row { display: flex; gap: var(--space-3); padding: 10px 0; border-bottom: 1px solid var(--hairline); }
.skeleton .sk-row .sk-line { flex: 1; }
.skeleton .sk-row .sk-line.short { flex: 0 0 50px; }
@keyframes sk-shine { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

/* 分段标签：矿石切片 */
.seg-tabs { display: inline-flex; background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--radius-pill); padding: 3px; gap: 2px; }
.seg-tabs .seg { padding: 6px 15px; font-size: var(--fs-base); font-weight: 500; color: var(--slate); border-radius: var(--radius-pill); cursor: pointer; transition: all var(--t-fast) var(--ease); user-select: none; }
.seg-tabs .seg:hover { color: var(--ink); }
.seg-tabs .seg.on { background: var(--ink); color: var(--on-dark); font-weight: 700; box-shadow: var(--shadow-1); }
:root[data-theme="dark"] .seg-tabs .seg.on { background: var(--primary); color: #221a08; }

.search-in:focus-within, .topbar .search:focus-within { box-shadow: 0 0 0 3.5px rgba(180,83,9,.16); border-color: var(--primary) !important; background: var(--card); transition: box-shadow var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease); }

/* 复核问题条目：色条 + 芯片规则号 */
.ws-issue { padding: 11px 14px 11px 16px; border-bottom: 1px solid var(--hairline); font-size: 12.5px; line-height: 1.55; transition: background var(--t-fast); position: relative; cursor: pointer; }
.ws-issue::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: transparent; }
.ws-issue.issue-h::before { background: var(--error); }
.ws-issue.issue-m::before { background: var(--warning); }
.ws-issue:hover { background: var(--surface-soft); }
.ws-issue .rid { font-weight: 700; margin-right: 6px; padding: 1px 7px; border-radius: 6px; font-size: 10.5px; font-family: var(--font-num); letter-spacing: .2px; }
.ws-issue.issue-h .rid { background: rgba(220,38,38,.1); color: var(--error); }
.ws-issue.issue-m .rid { background: rgba(217,119,6,.13); color: var(--warning); }
.ws-issue .msg { color: var(--charcoal); }
.ws-issue .fld { color: var(--muted); font-size: 11px; margin-top: 4px; font-family: var(--font-num); }

@keyframes rowFlashAnim {
  0%, 100% { background-color: transparent; }
  25%, 55% { background-color: rgba(245, 158, 11, .38); }
  75% { background-color: rgba(245, 158, 11, .16); }
}
.t-row.flash { animation: rowFlashAnim 1.2s ease 2; }
.t-row.flash-flat { background-color: rgba(245, 158, 11, .26) !important; }

/* 连接状态条 */
.connbar { display: flex; align-items: center; gap: 8px; padding: 7px 28px; font-size: 12px; border-bottom: 1px solid var(--hairline); }
.connbar .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: 0 0 8px; }
.connbar.ok { background: var(--tint-mint); color: var(--success); }
.connbar.ok .dot { background: var(--success); box-shadow: 0 0 0 3px rgba(63,143,95,.18); }
.connbar.local { background: var(--surface); color: var(--steel); }
.connbar.local .dot { background: var(--muted); }
.connbar a { margin-left: auto; font-weight: 700; cursor: pointer; }
.pagination { display: flex; align-items: center; justify-content: flex-end; gap: 10px; padding: 11px 16px; border-top: 1px solid var(--hairline); background: var(--surface-soft); }
.pagination .pg-info { color: var(--steel); font-size: 12px; margin-right: auto; }
.pagination select { border: 1px solid var(--hairline-strong); border-radius: 8px; padding: 4px 6px; background: var(--card); color: var(--ink); }
.build-actions { display: flex; gap: 12px; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--hairline-strong); }

/* ============ 数据工作台 ============ */
.ws-head { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 20px; gap: 14px; flex-wrap: wrap; }
.ws-title { font-size: 30px; font-weight: 800; letter-spacing: -.8px; color: var(--ink); line-height: 1.1; }
.ws-sub { color: var(--slate); font-size: 13.5px; margin-top: 6px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ws-sub .db-chip {
  display: inline-flex; align-items: center; gap: 6px; background: var(--card); border: 1px solid var(--hairline);
  border-radius: 8px; padding: 2px 10px; font-size: 11.5px; font-weight: 700; color: var(--charcoal); font-family: var(--font-num);
}
.ws-sub .db-chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 3px rgba(63,143,95,.16); }

/* KPI 仪表盘横条：三合一，内嵌分隔线 + 占比小棒，省纵向空间 */
.ws-stats {
  display: grid; grid-template-columns: repeat(3, 1fr); margin-bottom: var(--space-5);
  background: var(--card); border: 1px solid var(--hairline); border-radius: var(--radius-xl);
  box-shadow: var(--shadow-card); overflow: hidden;
}
.ws-stat {
  cursor: pointer; position: relative; padding: 16px 20px 15px; display: flex; align-items: center; gap: 14px;
  transition: background var(--t-fast) var(--ease); overflow: hidden;
}
.ws-stats .ws-stat + .ws-stat { border-left: 1px solid var(--hairline); }
.ws-stat:hover { background: var(--surface-soft); }
.ws-stat .stat-top { display: contents; }
.ws-stat .lbl { font-size: 11.5px; color: var(--steel); font-weight: 700; letter-spacing: .6px; text-transform: uppercase; display: block; }
.ws-stat .ic { width: 40px; height: 40px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 40px; }
.ws-stat[data-tone="ok"] .ic { background: rgba(63,143,95,.12); color: var(--success); }
.ws-stat[data-tone="warn"] .ic { background: rgba(217,119,6,.15); color: var(--warning); }
.ws-stat[data-tone="error"] .ic { background: rgba(220,38,38,.1); color: var(--error); }
.ws-stat .stat-body { flex: 1; min-width: 0; }
.ws-stat .num { font-size: 30px; font-weight: 800; letter-spacing: -1px; line-height: 1.02; font-family: var(--font-num); display: inline-block; }
.ws-stat .sub { font-size: 11.5px; color: var(--steel); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ws-stat .meter { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: transparent; overflow: hidden; }
.ws-stat .meter i { display: block; height: 100%; transition: width .6s var(--ease); }
.ws-stat[data-tone="ok"] .meter i { background: var(--success); }
.ws-stat[data-tone="warn"] .meter i { background: var(--warning); }
.ws-stat[data-tone="error"] .meter i { background: linear-gradient(90deg, var(--warning), var(--error)); }
.ws-stat[data-tone="warn"] { background: linear-gradient(180deg, rgba(217,119,6,.05), transparent 70%); }
.ws-stat[data-tone="warn"] .num { color: var(--warning); }
.ws-stat[data-tone="error"] { background: linear-gradient(180deg, rgba(220,38,38,.045), transparent 70%); }
.ws-stat[data-tone="error"] .num { color: var(--error); }
.ws-stat .go { color: var(--muted); opacity: 0; transform: translateX(-4px); transition: all var(--t-fast) var(--ease); font-size: 16px; flex: 0 0 auto; }
.ws-stat:hover .go { opacity: 1; transform: translateX(0); color: var(--primary); }

/* 三栏：钻孔/问题切换 + 加宽中栏表格 */
.ws-grid { display: grid; grid-template-columns: 218px minmax(0,1fr) 252px; gap: 14px; align-items: stretch; }
.ws-panel { background: var(--card); border: 1px solid var(--hairline); border-radius: var(--radius-xl); box-shadow: var(--shadow-card); overflow: hidden; transition: box-shadow var(--t-mid) var(--ease); }
.ws-panel:hover { box-shadow: var(--shadow-2); }
.ws-panel .p-head { padding: 13px 16px; border-bottom: 1px solid var(--hairline); font-size: 13px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.ws-panel .p-head .cnt { font-size: 11px; font-weight: 600; color: var(--steel); background: var(--surface); border-radius: 999px; padding: 2px 9px; }

/* 钻孔列表：切片式 */
#wsHoles { padding: 6px; }
.ws-hole {
  padding: 9px 11px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 6px;
  font-size: 13px; border-radius: 10px; border-left: 3px solid transparent; margin-bottom: 2px;
  transition: all var(--t-fast) var(--ease); font-family: var(--font-num); font-weight: 500;
}
.ws-hole:hover { background: var(--surface-soft); }
.ws-hole.active { background: var(--primary-soft); color: var(--primary); font-weight: 800; border-left-color: var(--primary); }
.ws-hole.risk-h:not(.active) { border-left-color: rgba(220,38,38,.5); }
.ws-hole.risk-m:not(.active) { border-left-color: rgba(217,119,6,.5); }
.ws-hole > span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.ws-hole > span:last-child { white-space: nowrap; flex-shrink: 0; margin-left: 8px; display: inline-flex; align-items: center; }
.ws-badge { font-size: 10px; padding: 1px 7px; border-radius: 999px; color: #fff; font-weight: 700; margin-left: 4px; font-family: var(--font-num); box-shadow: 0 1px 2px rgba(0,0,0,.15); }
.ws-badge.h { background: var(--error); }
.ws-badge.m { background: var(--warning); }

.ws-toolbar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--hairline); flex-wrap: wrap; }
.ws-toolbar #wsCurTable { font-size: 11.5px; color: var(--muted); font-family: var(--font-num); }
.ws-empty { padding: 48px 20px; text-align: center; color: var(--steel); font-size: 14px; }

/* 上传空态：大标题 + 虚线投放区 */
.ws-upload { max-width: 660px; margin: 56px auto; text-align: center; }
.ws-upload .eyebrow { font-size: 12px; font-weight: 800; color: var(--primary); letter-spacing: 2.4px; text-transform: uppercase; margin-bottom: 12px; display: inline-flex; align-items: center; gap: 8px; }
.ws-upload .eyebrow::before, .ws-upload .eyebrow::after { content: ""; width: 22px; height: 1.5px; background: var(--primary); opacity: .6; }
.ws-upload .big { font-size: 42px; font-weight: 800; letter-spacing: -1px; margin-bottom: 12px; }
.ws-upload .drop {
  margin: 30px auto 0; padding: 46px 24px; border: 2px dashed var(--hairline-strong); border-radius: 22px;
  background: var(--card); cursor: pointer; transition: all .22s var(--ease);
}
.ws-upload .drop:hover { border-color: var(--primary); background: var(--primary-soft); transform: translateY(-2px); box-shadow: var(--shadow-2); }

/* 工具箱卡片：图标徽标 + 编号 + hover 提升 */
.ws-tool-card { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.ws-tool-card .card { background: var(--card); border: 1px solid var(--hairline); border-radius: var(--radius-xl); padding: 20px; box-shadow: var(--shadow-card); cursor: pointer; transition: transform .18s var(--ease), box-shadow .18s var(--ease), border-color .18s var(--ease); position: relative; overflow: hidden; }
.ws-tool-card .card::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: linear-gradient(180deg, var(--primary-bright), var(--primary)); opacity: 0; transition: opacity .18s; }
.ws-tool-card .card:hover { transform: translateY(-3px); box-shadow: var(--shadow-2); border-color: var(--hairline-strong); }
.ws-tool-card .card:hover::after { opacity: 1; }
.ws-tool-card .card .tc-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 13px; }
.ws-tool-card .card .tc-ic { width: 38px; height: 38px; border-radius: 11px; background: var(--primary-soft); color: var(--primary); display: inline-flex; align-items: center; justify-content: center; }
.ws-tool-card .card .tc-no { font-size: 11px; font-weight: 800; color: var(--muted); font-family: var(--font-num); letter-spacing: 1px; }
.ws-tool-card .card .t { font-size: 15.5px; font-weight: 800; margin-bottom: 6px; letter-spacing: -.2px; }
.ws-tool-card .card .d { font-size: 12.5px; color: var(--slate); line-height: 1.55; min-height: 38px; }
.ws-tool-card .card .a { display: inline-flex; align-items: center; gap: 5px; margin-top: 13px; color: var(--primary); font-size: 13px; font-weight: 700; }
.ws-tool-card .card .a::after { content: "→"; transition: transform .18s var(--ease); }
.ws-tool-card .card:hover .a::after { transform: translateX(3px); }

/* 参数中心 */
.cfg-grid { columns: 2; column-gap: 14px; margin-top: 4px; }
.cfg-panel { break-inside: avoid; margin-bottom: 14px; border-radius: 14px; }
.cfg-panel .p-head { padding: 12px 16px; font-size: 13px; font-weight: 700; letter-spacing: .2px; border-bottom: 1px solid var(--hairline); display: flex; align-items: center; gap: 8px; background: linear-gradient(180deg, rgba(180,83,9,.05), transparent); }
.cfg-panel .p-head .cnt { margin-left: auto; font-size: 11px; font-weight: 600; color: var(--muted); background: var(--surface); border-radius: 999px; padding: 1px 8px; }
.cfg-body { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; padding: 12px 14px 14px; align-content: start; }
.cfg-sub { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; margin: 6px 0 2px; font-size: 12.5px; font-weight: 700; color: var(--charcoal); }
.cfg-card { background: var(--surface-soft); border: 1px solid transparent; border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: row; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; height: 100%; transition: border-color var(--t-fast) var(--ease); }
.cfg-card.col { flex-direction: column; align-items: stretch; }
.cfg-card:hover { border-color: var(--hairline-strong); }
.cfg-card .cfg-label { font-size: 12px; color: var(--steel); font-weight: 600; flex: 0 1 auto; max-width: 62%; display: flex; align-items: center; gap: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cfg-card.col .cfg-label { max-width: 100%; }
.cfg-card.ro { opacity: .78; }
.cfg-card .cfg-val { font-size: 12.5px; color: var(--ink); }
.cfg-note { grid-column: 1 / -1; background: var(--primary-soft); border: 1px solid rgba(180,83,9,.2); border-radius: 10px; padding: 8px 12px; font-size: 12px; color: var(--steel); line-height: 1.55; }
.cfg-note .cfg-label { color: var(--primary); font-weight: 700; font-size: 11.5px; margin-bottom: 2px; letter-spacing: .3px; }
.cfg-state-table { grid-column: 1 / -1; border: 1px solid var(--hairline); border-radius: 10px; overflow: hidden; background: var(--card); }
.cfg-state-row { display: grid; grid-template-columns: 118px 1fr; align-items: center; border-bottom: 1px solid var(--hairline); }
.cfg-state-row:last-child { border-bottom: none; }
.cfg-state-row .st { padding: 7px 12px; font-size: 12.5px; font-weight: 600; color: var(--charcoal); background: var(--surface-soft); border-right: 1px solid var(--hairline); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cfg-state-row input { margin: 6px 10px; min-width: 0; background: var(--card); border: 1px solid var(--hairline-strong); border-radius: 8px; height: 30px; padding: 0 10px; }
@media (max-width: 720px) {
  .cfg-grid { columns: 1; }
  .cfg-body { grid-template-columns: 1fr; }
  .cfg-state-row { grid-template-columns: 96px 1fr; }
}

/* 开关 */
.switch { position: relative; display: inline-block; width: 44px; height: 25px; flex: 0 0 auto; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch span { position: absolute; inset: 0; background: var(--hairline-strong); border-radius: 999px; transition: .2s; }
.switch span:before { content: ""; position: absolute; width: 21px; height: 21px; left: 2px; top: 2px; background: #fff; border-radius: 50%; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: .2s; }
.switch input:checked + span { background: var(--primary); }
.switch input:checked + span:before { transform: translateX(19px); }

@media (max-width: 1100px) {
  .ws-grid { grid-template-columns: 1fr; }
  .ws-stats { grid-template-columns: repeat(2, 1fr); }
  .ws-tool-card { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 768px) {
  .sidebar { display: none; }
  .topbar { padding: 0 16px; }
  .topbar .search { display: none; }
  .ws-stats { grid-template-columns: 1fr 1fr; gap: 10px; }
  .ws-title { font-size: 24px; }
  .login-brand { display: none; }
  .login-form-area { padding: 24px; }
  .ws-tool-card { grid-template-columns: 1fr; }
  .ws-head { flex-direction: column; align-items: flex-start; gap: 12px; }
}
@media (max-width: 480px) {
  .ws-stats { grid-template-columns: 1fr; }
}

/* ============ 数据表格细节 ============ */
.t-row { transition: background .12s; }
.t-row:hover { background: rgba(180,83,9,.05); }
:root[data-theme="dark"] .t-row:hover { background: rgba(245,242,234,.04); }

.t-head .cell-fixed, .t-row .cell-fixed { position: sticky; background: inherit; }
.t-row .cell-fixed { z-index: 1; }
.t-head .cell-fixed { z-index: 4; }
.t-row.cell-active { box-shadow: inset 3px 0 0 var(--primary); background: var(--primary-soft) !important; }
.t-row .cell-clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.4; }
.t-head .col-sort { cursor: pointer; color: var(--steel); display: inline-flex; align-items: center; justify-content: center; min-width: 0; }
.t-head .col-sort:hover, .t-head .col-sort.sorted { color: var(--primary); }
.t-head .col-act { display: none; }
.t-head div:hover .col-act, .t-head .col-act:hover { display: inline-flex; }
#onlineGrid:focus { outline: none; }
#onlineGrid:focus-visible { outline: 1px solid var(--primary); outline-offset: -1px; }

#onlineGrid .t-head > div { justify-content: center; text-align: center; white-space: normal; word-break: break-all; line-height: 1.25; }
#onlineGrid .t-row > div { text-align: center; font-variant-numeric: tabular-nums; }
#onlineGrid .t-row > div .btn-link { white-space: nowrap; }

::-webkit-scrollbar-thumb { background: var(--hairline-strong); border-radius: 6px; border: 2.5px solid var(--canvas); }
::-webkit-scrollbar-thumb:hover { background: var(--muted); }
::-webkit-scrollbar-track { background: transparent; }

<script>
// P2-2：IndexedDB 本地存储层已删除（v31+ 起全站走 FastAPI 后端，openDB/seed/
// sha256/dbAll 等为旧架构遗留死代码；登录鉴权与数据均在后端）

function toggleTheme(){
  const root = document.documentElement;
  const dark = root.getAttribute('data-theme') !== 'dark';
  root.setAttribute('data-theme', dark ? 'dark' : '');
  localStorage.setItem('lifan_theme', dark ? 'dark' : 'light');
}
(function(){
  const t = localStorage.getItem('lifan_theme');
  if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  else if (!t && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
})();

function toggleSidebar(){
  const sb = document.getElementById('sidebar');
  if (!sb) return;
  sb.classList.toggle('collapsed');
  try { localStorage.setItem('lifan_sidebar_collapsed', sb.classList.contains('collapsed') ? '1' : '0'); } catch(e){}
}
(function(){
  try {
    const v = localStorage.getItem('lifan_sidebar_collapsed');
    const sb = document.getElementById('sidebar');
    if (sb && v === '0') sb.classList.remove('collapsed');
  } catch(e){}
})();

function getToken(){ return localStorage.getItem('lifan_token') || ''; }
function setToken(t){ if (t) localStorage.setItem('lifan_token', t); else localStorage.removeItem('lifan_token'); }
const API_STATE = {
  online: false,
  checked: false,
  dbId: null,
  dbName: '',
  dbSize: 0,
  tables: null,
};

function loadApiState(){
  try {
    const s = JSON.parse(localStorage.getItem('lifan_api_state') || 'null');
    if (s && s.dbId) {
      API_STATE.dbId = s.dbId; API_STATE.dbName = s.dbName || '';
      API_STATE.dbSize = s.dbSize || 0; API_STATE.tables = s.tables || null;
    }
  } catch (e) {  }
}
function saveApiState(){
  try {
    localStorage.setItem('lifan_api_state', JSON.stringify({
      dbId: API_STATE.dbId, dbName: API_STATE.dbName,
      dbSize: API_STATE.dbSize, tables: API_STATE.tables,
    }));
  } catch (e) {  }
}
function clearApiState(){
  API_STATE.dbId = null; API_STATE.dbName = ''; API_STATE.dbSize = 0; API_STATE.tables = null;
  try { localStorage.removeItem('lifan_api_state'); } catch (e) {}
}

class ApiError extends Error {
  constructor(msg, status){ super(msg); this.status = status || 0; }
}

async function apiFetch(path, options = {}){
  const url = '/api' + path;
  const timeout = options.timeout || 20000;
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeout);
  let res;
  try {
    const isForm = options.body instanceof FormData;
    const t = getToken();
    const headers = Object.assign({}, options.headers || {});
    if (!isForm && !headers['Content-Type']) headers['Content-Type'] = 'application/json';
    if (t) headers['Authorization'] = 'Bearer ' + t;
    res = await fetch(url, {
      method: options.method || 'GET',
      headers,
      body: options.body === undefined ? undefined : (isForm ? options.body : JSON.stringify(options.body)),
      signal: ctrl.signal,
    });
  } catch (e) {
    const msg = e && e.name === 'AbortError' ? '请求超时，请稍后重试' : '无法连接后端服务（' + url + '）';
    if (!options.silent) showToast(msg, 'err');
    throw new ApiError(msg);
  } finally { clearTimeout(timer); }
  if (res.status === 401) {
    setToken('');
    try { localStorage.removeItem('lifan_session'); } catch (e) {  }
    session = null;
    showToast('登录已过期，请重新登录', 'err');
    const lp = document.getElementById('loginPage');
    if (lp) { lp.style.display = 'flex'; }
    const ap = document.getElementById('app');
    if (ap) ap.classList.remove('show');
    throw new ApiError('未登录或登录已过期', 401);
  }
  if (!res.ok) {
    let msg = '请求失败（HTTP ' + res.status + '）';
    try {
      const j = await res.json();
      if (j && j.detail !== undefined) msg = typeof j.detail === 'string' ? j.detail : JSON.stringify(j.detail);
    } catch (e) {  }
    if (!options.silent) showToast(msg, 'err');
    throw new ApiError(msg, res.status);
  }
  if (res.status === 204) return null;
  const ct = (res.headers.get('content-type') || '').toLowerCase();
  return ct.includes('application/json') ? res.json() : res;
}
function apiGet(path, opts){ return apiFetch(path, opts || {}); }
function apiPost(path, body, opts){ return apiFetch(path, Object.assign({ method: 'POST', body }, opts || {})); }
function apiPut(path, body, opts){ return apiFetch(path, Object.assign({ method: 'PUT', body }, opts || {})); }
function apiDelete(path, opts){ return apiFetch(path, Object.assign({ method: 'DELETE' }, opts || {})); }
function apiUpload(path, file, opts){
  const fd = new FormData();
  fd.append('file', file);
  return apiFetch(path, Object.assign({ method: 'POST', body: fd, timeout: 120000 }, opts || {}));
}

async function detectBackend(){
  try {
    const h = await apiFetch('/health', { timeout: 2500, silent: true });
    API_STATE.online = !!(h && h.status === 'ok');
  } catch (e) {
    API_STATE.online = false;
  }
  API_STATE.checked = true;
  updateConnBar();
  return API_STATE.online;
}
function updateConnBar(){
  const bar = document.getElementById('connBar');
  if (!bar) return;
  if (API_STATE.online) {
    bar.className = 'connbar ok';
    bar.innerHTML = '<span class="dot"></span>在线模式 · 后端健康 ✓' +
      (API_STATE.dbId ? ' · 工作库 <b>db_id=' + API_STATE.dbId + '</b>' : ' · 尚未上传数据库') +
      '<a href="javascript:;" onclick="recheckBackend()">重检连接</a>';
  } else {
    bar.className = 'connbar local';
    bar.innerHTML = '<span class="dot"></span>本地模式 · 后端未连接（IndexedDB 演示数据仍可用）' +
      '<a href="javascript:;" onclick="recheckBackend()">检测后端</a>';
  }
  bar.hidden = false;
}
async function recheckBackend(){
  await detectBackend();
  const r = (location.hash || '').replace('#', '');
  if (ROUTES.includes(r)) route(r); else render('mdb');
}
function fmtSize(n){
  if (n == null) return '—';
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1048576).toFixed(2) + ' MB';
}
function ts(){ return new Date().toTimeString().slice(0, 8); }
function escHtml(s){ return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function escAttr(s){ return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }
function escJs(s){ return escAttr(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }  // P2-1：onclick 单引号字符串注入防护
function qsName(form, name){ return form.querySelector('[name="' + String(name).replace(/"/g, '\\"') + '"]'); }

let session = null;
// P2-2：角色权限表删除——Web 端登录后恒为管理员（后端仅 admin 账号），
// can() 保留为恒真兼容既有调用点（inlineEdit/cyChange/delOnlineRow）
function can(perm){ return true; }

function showToast(msg, type='ok'){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  setTimeout(() => t.className = 'toast', 2200);
}


document.addEventListener('keydown', e => {
  const ae = document.activeElement;
  const inEditable = ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.isContentEditable);
  const k = e.key || '';
  if ((e.metaKey || e.ctrlKey) && (k === 'k' || k === 'K')) {
    const gs = document.getElementById('globalSearch');
    if (gs) { e.preventDefault(); gs.focus(); gs.select(); }
    return;
  }
  if (k === 'Escape' && !inEditable) {
    const gs = document.getElementById('globalSearch');
    if (gs && gs.value) { gs.value = ''; }
    if (WS.zkbh) {
      OData.keyword = WS.zkbh; OData.searchCol = 'ZKBH'; OData.exact = true;
      OData.page = 1;
      document.querySelectorAll('.ws-hole').forEach(el => el.classList.toggle('active', el.dataset.zk === WS.zkbh));
      if (typeof loadOnlinePage === 'function') loadOnlinePage(1);
      e.preventDefault();
    } else {
      OData.keyword = ''; OData.searchCol = '';
      OData.page = 1;
      if (typeof loadOnlinePage === 'function') loadOnlinePage(1);
      e.preventDefault();
    }
  }
});

// 顶栏全局搜索：Enter 按钻孔编号模糊定位并选中（v19 删除工作台搜索框后此处恢复功能）
(function bindGlobalSearch(){
  const gs = document.getElementById('globalSearch');

function fmtNum(v){
  if (v === null || v === undefined || v === '') return '';
  if (typeof v === 'number') {
    if (!isFinite(v)) return String(v);
    if (Number.isInteger(v)) return String(v);
    return String(Math.round(v * 1000) / 1000);
  }
  if (typeof v === 'string') {
    const t = v.trim();
    if (t === '') return '';
    const n = Number(t);
    if (!isNaN(n) && /^[+-]?\d+(\.\d+)?$/.test(t)) {
      if (Number.isInteger(n)) return String(n);
      return String(Math.round(n * 1000) / 1000);
    }
    return v;
  }
  return String(v);
}

async function wsLoadReview(){
  try {
    const data = await apiPost(wsReviewQuery(), {});
    WS.review = data;
    const s = data.summary || {};
    const by = data.by_hole || {};
    const holes = document.getElementById('wsS0'), risk = document.getElementById('wsS1'),
          total = document.getElementById('wsS3');
    const holesN = s.holes || 0;
    const riskN = Object.keys(by).filter(k => by[k].h || by[k].m).length;
    const totalN = s.total || 0;
    if (holes) holes.textContent = holesN;
    if (risk) risk.textContent = riskN;
    if (total) total.textContent = totalN;
    const m0 = document.getElementById('wsS0M'), m1 = document.getElementById('wsS1M'), m3 = document.getElementById('wsS3M');
    if (m0) m0.style.width = '100%';
    if (m1) m1.style.width = (holesN ? Math.min(100, Math.round(riskN / holesN * 100)) : 0) + '%';
    if (m3) m3.style.width = (holesN ? Math.min(100, Math.round(totalN / (holesN * 3) * 100)) : 0) + '%';
    const riskSub = document.getElementById('wsS1Sub');
    if (riskSub) riskSub.textContent = 'H 级孔 ' + Object.keys(by).filter(k => by[k].h).length +
      ' · M 级孔 ' + Object.keys(by).filter(k => by[k].m).length + ' · 点击跳转';
    const totalSub = document.getElementById('wsS3Sub');
    if (totalSub) totalSub.textContent = 'H 级 ' + (s.h || 0) + ' · M 级 ' + (s.m || 0) + ' · 点击跳转';

    wsRenderHoles();
    wsRenderAllIssues();
    const first = Object.keys(by).sort((a, b) => String(a).localeCompare(String(b), 'zh-Hans-CN', { numeric: true }))[0];
    if (first) wsSelectHole(first);
    await wsInitTables();
  } catch (e) {
    showToast('复核失败：' + ((e && e.message) || e), 'err');
  }
}

function wsRenderHoles(){
  const by = (WS.review && WS.review.by_hole) || {};
  const natSort = (a, b) => String(a).localeCompare(String(b), 'zh-Hans-CN', { numeric: true });
  let list = Object.keys(by).sort(natSort);
  if (WS.onlyIssues) list = list.filter(k => by[k].h || by[k].m);
  const box = document.getElementById('wsHoles');
  const cnt = document.getElementById('wsHoleCount');
  if (cnt) cnt.textContent = list.length + ' 孔' + (WS.onlyIssues ? '（问题）' : '');
  if (box) {
    box.innerHTML = list.map(zk => wsHoleItem(zk, by[zk])).join('')
      || '<div style="padding:20px;color:var(--muted);font-size:12.5px;text-align:center;">无问题钻孔</div>';
  }
}

function wsKpiJump(kind){
  const by = (WS.review && WS.review.by_hole) || {};
  const natSort = (a, b) => String(a).localeCompare(String(b), 'zh-Hans-CN', { numeric: true });
  const all = Object.keys(by).sort(natSort);
  const risky = all.filter(k => by[k].h || by[k].m);
  const hOnly = all.filter(k => by[k].h);
  let target = null, onlyIssues = false;
  if (kind === 'all') { onlyIssues = false; target = all[0] || null; }
  else if (kind === 'h') { onlyIssues = true; target = hOnly[0] || risky[0] || null; }
  else { onlyIssues = true; target = risky[0] || null; }
  WS.onlyIssues = onlyIssues;
  const cb = document.getElementById('wsOnlyIssues');
  if (cb) cb.checked = onlyIssues;
  wsRenderHoles();
  if (target) {
    try {
      const el = document.querySelector('.ws-hole[data-zk="' + CSS.escape(target) + '"]');
      if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.click(); }
      else wsSelectHole(target);
    } catch (e) { wsSelectHole(target); }
  }
}

function wsHoleItem(zk, info){
  const tags = (info.h ? '<span class="ws-badge h">H·' + info.h + '</span>' : '') +
               (info.m ? '<span class="ws-badge m">M·' + info.m + '</span>' : '');

         '<span>' + escHtml(zk) + '</span><span>' + tags + '</span></div>';

async function wsSelectHole(zk){
  const seq = (WS._seq = (WS._seq || 0) + 1);  // 竞态防护：快速切换孔时丢弃过期复核结果（v45）
  WS.zkbh = zk;

  const box = document.getElementById('wsIssues');
  const cnt = document.getElementById('wsIssueCount');
  if (box) box.innerHTML = '<div style="padding:20px;color:var(--muted);font-size:13px;">加载 ' + escHtml(zk) + ' 复核结果…</div>';
  try {
    const r = await apiGet(wsReviewHoleQuery(zk));
    if (seq !== WS._seq) return;  // 过期请求丢弃
    const issues = r.issues || [];
    if (cnt) cnt.textContent = issues.length + ' 项';
    if (box) {
      box.innerHTML = issues.map(i => {

        const rtab = RULE_TAB[i.rule_id] || 'z_g_TuCeng';
        const rv = (i.ref_value === undefined || i.ref_value === null || i.ref_value === '' || i.ref_value === 0) ? '' : i.ref_value;
        return '<div class="ws-issue issue-' + (i.level === 'H' ? 'h' : 'm') + '" data-idx="' + (i.layer_index === undefined || i.layer_index === null ? -1 : i.layer_index) + '" data-tab="' + rtab + '" data-refv="' + escAttr(String(rv)) + '" onclick="jumpToIssue(this)" title="点击定位到对应数据行"><div><span class="rid">' + escHtml(i.rule_id) + '</span>' +
        '<span class="msg">' + escHtml(i.message) + '</span></div>' +
        (i.field ? '<div class="fld">' + escHtml(i.field) + '</div>' : '') + '</div>';
      }).join('')
        || '<div style="padding:20px;color:var(--success);font-size:13px;">✓ 本孔复核通过</div>';
    }
  } catch (e) {
    if (seq !== WS._seq) return;
    if (box) box.innerHTML = '<div style="padding:20px;color:var(--error);font-size:13px;">加载失败：' + escHtml((e && e.message) || e) + '</div>';
  }

  if (!API_STATE.tables) await wsInitTables();
  if (seq !== WS._seq) return;
  wsSetTab('z_g_TuCeng');
}

async function jumpToIssue(card){
  if (!card) return;
  const idx = parseInt(card.dataset.idx || '-1', 10);
  const tab = card.dataset.tab || 'z_g_TuCeng';
  const refv = (card.dataset.refv || '').trim();

  if (WS.zkbh) {
    const si = document.getElementById('onlineSearch');
    if (si && si.value !== WS.zkbh) {
      si.value = WS.zkbh; OData.keyword = WS.zkbh; OData.searchCol = 'ZKBH';
      OData.exact = true; OData.page = 1;
    }
  }

  if (OData.table !== tab) wsSetTab(tab);
  else { OData.orderBy = ''; OData.orderDir = ''; }  // 地层跳转须按 TCCDSD 行序（layer_index 口径），重置用户排序（v43）
  await loadOnlinePage(OData.page);

  const matchCol = { 'z_y_BiaoGuan':'BGDSD', 'z_y_DongTan':'DTDSD', 'z_c_QuYang':'QYBH', 'z_c_KeFen':'QYBH' }[tab] || '';
  const cols = WS_COLS[OData.table] || [];
  const t0 = Date.now();
  let row = null;
  while (Date.now() - t0 < 2500) {
    const rows = document.querySelectorAll('#onlineGrid .t-row');
    if (!rows.length) { await new Promise(r => setTimeout(r, 120)); continue; }
    if (tab === 'z_g_TuCeng' && idx >= 0 && rows.length > idx) { row = rows[idx]; break; }
    if (matchCol && refv !== '') {
      const ci = cols.indexOf(matchCol);
      if (ci >= 0) {
        const isNum = (matchCol !== 'QYBH');
        for (let i = 0; i < rows.length; i++) {
          const cell = rows[i].children[ci + 1];
          if (!cell) continue;
          const v = cell.textContent.trim();
          if (isNum) {
            const a = parseFloat(v), b = parseFloat(refv);
            if (!isNaN(a) && !isNaN(b) && Math.abs(a - b) < 0.011) { row = rows[i]; break; }
          } else if (v === refv) { row = rows[i]; break; }
        }
        if (row) break;
      }
    }
    await new Promise(r => setTimeout(r, 120));
  }

  if (!row) { showToast('问题行暂未显示，请检查筛选或分页', 'info'); return; }

  row.scrollIntoView({ behavior: 'smooth', block: 'center' });

  row.classList.remove('flash', 'flash-flat');
  void row.offsetWidth;
  row.classList.add('flash');
  setTimeout(() => {
    row.classList.remove('flash');
    row.classList.add('flash-flat');
    setTimeout(() => row.classList.remove('flash-flat'), 900);
  }, 2400);
}

let WS_TABS_DONE = false;
async function wsInitTables(){
  if (!API_STATE.tables) {
    try {
      const r = await apiGet('/db/' + encodeURIComponent(API_STATE.dbId) + '/tables');
      API_STATE.tables = {};
      (r.tables || []).forEach(t => API_STATE.tables[t] = null);
      saveApiState();
    } catch (e) { return; }
  }
  const names = Object.keys(API_STATE.tables);
  if (!names.length) return;

  if (OData.hiddenCols['z_g_TuCeng'] === undefined) {
    OData.hiddenCols['z_g_TuCeng'] = { TCHD: true };
  }
  if (!OData.table || !names.includes(wsRealTable(OData.table))) OData.table = names[0];
  const cur = document.getElementById('wsCurTable');
  if (cur) cur.textContent = '当前表：' + (WS_TAB_CN[OData.table] || COLUMN_CN[wsRealTable(OData.table)] || OData.table);
  const tabs = document.getElementById('wsTabs');
  if (tabs) {
    const defs = [['z_g_TuCeng','地层'],['z_c_QuYang','土工试验'],['z_c_KeFen','颗分试验'],['z_y_DongTan','动探'],['z_y_BiaoGuan','标贯'],['z_g_ShuiWei','水位']];
    tabs.className = 'seg-tabs';
    tabs.innerHTML = defs.filter(d => names.includes(wsRealTable(d[0]))).map(d =>
      '<div class="seg" data-t="' + d[0] + '" onclick="wsSetTab(\'' + d[0] + '\')">' + d[1] + '</div>').join('');
    wsMarkTab();
  }

  const si = document.getElementById('onlineSearch');
  if (si && !si.dataset.bound) {
    si.dataset.bound = '1';
    si.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const kw = si.value.trim();
        if (kw) {
          document.querySelectorAll('.ws-hole').forEach(el => el.classList.remove('active'));
          OData.keyword = kw; OData.searchCol = ''; OData.exact = false; OData.page = 1;
        } else if (WS.zkbh) {
          si.value = WS.zkbh;
          OData.keyword = WS.zkbh; OData.searchCol = 'ZKBH'; OData.exact = true; OData.page = 1;
          document.querySelectorAll('.ws-hole').forEach(el => el.classList.toggle('active', el.dataset.zk === WS.zkbh));
        } else {
          OData.keyword = ''; OData.searchCol = ''; OData.exact = false; OData.page = 1;
        }
        loadOnlinePage(1);
      }
    });
  }
}

          flat.push({ zkbh: s.zkbh, layer: s.layer_label || '', bgdsd: s.bgdsd,
                      old_n: s.old_n, new_n: s.new_n, ref: s.ref_source || s.issue_type || '',

          ${flat.length ? '<button class="btn btn-primary" style="padding:4px 14px;height:30px;font-size:12px;" onclick="toolsSptApply()">一键应用全部' + (nCnt ? '（击数 ' + nCnt + '）' : '') + (cCnt ? '（状态 ' + cCnt + '）' : '') + '</button>' : ''}

function sptEditN(el){
  if (!el || el.dataset.editing) return;
  const old = el.textContent.trim();
  el.dataset.editing = '1';
  const inp = document.createElement('input');
  inp.type = 'number'; inp.value = old; inp.min = '1'; inp.step = '1';
  inp.style.cssText = 'width:56px;height:26px;border:1px solid var(--primary);border-radius:6px;text-align:center;font-size:12.5px;color:var(--primary);font-weight:700;background:var(--canvas);';
  el.textContent = '';
  el.appendChild(inp);
  inp.focus(); inp.select();
  const finish = (save) => {
    el.dataset.editing = '';
    const v = inp.value.trim();
    if (!save || v === '' || isNaN(parseInt(v, 10))) { el.textContent = old; return; }
    const n = parseInt(v, 10);
    el.textContent = String(n);
    const issue = el.closest('[data-zk]');
    if (issue) issue.dataset.n = String(n);
    showToast('修改后击数已更新为 ' + n + '（点「一键应用全部」写回）', 'info');
  };
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') finish(true); if (e.key === 'Escape') finish(false); });
  inp.addEventListener('blur', () => finish(true));
}

function toggleDxfParams(head){
  const box = head.nextElementSibling;
  if (!box) return;
  const show = box.style.display === 'none';
  box.style.display = show ? '' : 'none';
  if (show && !box.dataset.loaded) {
    box.dataset.loaded = '1';
    // 根据当前卡片判定所属参数段：纵断面卡片含 dxfHoles
    const sec = document.getElementById('dxfHoles') ? 'DXF_纵断面' : 'DXF_小柱状图';
    dxfLoadParams(sec, box);
  }
}
async function dxfLoadParams(sec, box){
  box.innerHTML = '<span style="font-size:12px;color:var(--steel);">加载参数…</span>';
  try {
    const g = await apiGet('/db/' + API_STATE.dbId + '/config?include_dxf=1', { timeout: 30000 });
    const st = (g.structured || {})[sec];
    if (!st) { box.innerHTML = '<span style="font-size:12px;color:var(--muted);">无参数配置</span>'; return; }
    box.innerHTML = '<div class="cfg-body" style="padding:4px 0;">' + renderCfgSection(sec, st, sec) + '</div>';
    // 内联表（岩土名称简化）不支持行级编辑：禁用并提示
    box.querySelectorAll('[data-path*="岩土名称简化"]').forEach(el => {

      '<span style="font-size:11.5px;color:var(--muted);">保存后下次生成立即生效</span>';

  } catch (e) {
    box.innerHTML = '<span style="color:var(--error);font-size:12px;">参数加载失败：' + escHtml((e && e.message) || e) + '</span>';

async function saveDxfParams(){
  const box = document.getElementById('dxfParams');
  if (!box) return;
  const updates = {};
  box.querySelectorAll('[data-path]').forEach(el => {
    if (el.disabled) return;
    const path = el.dataset.path, type = el.dataset.type;
    if (type === 'bool') updates[path] = el.checked;
    else if (type === 'num') {
      // 空输入表示不修改该配置；不要把清空误写成 0，避免下次生成触发
      // 除零或无限循环。需要清零的参数应由服务端允许的显式数值完成。
      if (el.value === '') return;
      updates[path] = Number(el.value);
    }
    else if (type === 'arr') updates[path] = el.value.split(',').map(s => s.trim()).filter(Boolean).map(s => /^\d+(\.\d+)?$/.test(s) ? Number(s) : s);
    else updates[path] = el.value;
  });
  if (!Object.keys(updates).length) { showToast('没有可保存的修改', 'info'); return; }
  try {
    const r = await apiPut('/db/' + API_STATE.dbId + '/config', { updates });
    const miss = (r.missing || []).length;
    showToast('已保存 ' + (r.applied || 0) + ' 项 DXF 参数' + (miss ? '，未识别 ' + miss + ' 项' : ''), (r.applied || 0) ? 'info' : 'err');
  } catch (e) { showToast('保存失败：' + ((e && e.message) || e), 'err'); }
}

async function toolsDxfRun(kind){
  const st = document.getElementById('dxfStatus');
  if (st) { st.textContent = '生成中…'; st.style.color = 'var(--steel)'; }
  try {
    let r;
    if (kind === 'profile') {
      const holes = (document.getElementById('dxfHoles') || {}).value || '';
      // C1/C2/C3：即时参数（留空/默认不传 → 后端回退 TOML）
      const qs = new URLSearchParams();
      qs.set('holes', holes);
      const hs = (document.getElementById('dxfHS') || {}).value;
      const vs = (document.getElementById('dxfVS') || {}).value;
      const gi = (document.getElementById('dxfGI') || {}).value;
      if (hs) qs.set('h_scale', hs);
      if (vs) qs.set('v_scale', vs);
      if (gi) qs.set('group_interval', gi);
      // 勾选框显式传值（打开卡片时已回填 TOML 当前值，所见即所发）
      if (document.getElementById('dxfCave')) qs.set('draw_cave', document.getElementById('dxfCave').checked ? 'true' : 'false');
      if (document.getElementById('dxfLabel')) qs.set('draw_label', document.getElementById('dxfLabel').checked ? 'true' : 'false');
      if (document.getElementById('dxfLabelText')) qs.set('draw_label_text', document.getElementById('dxfLabelText').checked ? 'true' : 'false');
      r = await apiPost('/db/' + API_STATE.dbId + '/dxf/profile?' + qs.toString(), {});
    } else {
      // C4：即时参数（留空不传 → 后端/函数内回退 TOML）
      const qs = new URLSearchParams();
      const ci = (document.getElementById('colInterval') || {}).value;
      const ch = (document.getElementById('colH') || {}).value;
      const cw = (document.getElementById('colW') || {}).value;
      if (ci) qs.set('interval', ci);
      if (ch) qs.set('col_h', ch);
      if (cw) qs.set('col_w', cw);
      const q = qs.toString();
      r = await apiPost('/db/' + API_STATE.dbId + '/dxf/columns' + (q ? '?' + q : ''), {});
    }
    const dl = r.download || '';

async function configRestoreKey(path){

function _jsonVal(v){
  try { return JSON.stringify(v); } catch (e) { return String(v); }
}
const STATE_ORDER = ['松散','稍密','中密','密实','流塑','软塑','可塑','硬塑','坚硬','不限制'];
const RANGE_KEY_RE = /^[\d.≤≥<>~×\s-]+$/;
function isStateMap(obj){
  if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return false;
  const keys = Object.keys(obj);
  if (!keys.length) return false;
  const rangeKeys = keys.filter(k => k !== '用途' && RANGE_KEY_RE.test(k));
  return rangeKeys.length >= 2;
}
function renderStateMap(key, obj){

  const rows = Object.entries(obj).filter(([k]) => k !== '用途');
  const order = {};
  STATE_ORDER.forEach((s, i) => order[s] = i);
  rows.sort((a, b) => (order[a[1]] ?? 99) - (order[b[1]] ?? 99) || String(a[0]).localeCompare(String(b[0]), 'zh'));
  const grid = rows.map(([k, v]) =>
    '<div class="cfg-state-row"><span class="st" title="' + escAttr(v) + '">' + escHtml(v) + '</span>' +
    '<input data-path="' + escAttr(key + '.' + k) + '" data-type="str" data-state="' + escAttr(v) + '" value="' + escAttr(k) + '" style="width:100%;height:32px;border:1px solid var(--hairline-strong);border-radius:8px;padding:0 10px;font-size:12.5px;box-sizing:border-box;">' +
    '</div>').join('');
  return '<div class="cfg-state-table">' + grid + '</div>';
}
function renderCfgSection(sec, obj, prefix){
  if (Array.isArray(obj) && obj.length && typeof obj[0] === 'object') {
    const base = prefix || sec;
    return obj.map((item, i) =>
      '<div style="grid-column:1/-1;background:var(--canvas);border:1px solid var(--hairline);border-radius:10px;padding:8px 12px;margin:4px 0;">' +
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;">' +
      Object.keys(item).map(sk => cfgRow(base + '_i' + i + '_' + sk, item[sk], true)).join('') + '</div></div>').join('');
  }
  if (obj === null || typeof obj !== 'object' || Array.isArray(obj)) {
    return cfgRow(prefix || sec, obj);
  }
  return Object.keys(obj).map(k => {
    const v = obj[k];
    const key = prefix ? prefix + '.' + k : k;
    if (v && typeof v === 'object' && !Array.isArray(v)) {
      if (isStateMap(v)) {
        return '<div class="cfg-sub">' + escHtml(k) + '</div>' + renderStateMap(key, v);
      }
      return '<div class="cfg-sub">' + escHtml(k) + '</div>' + renderCfgSection(sec, v, key);
    }
    return cfgRow(key, v);
  }).join('');
}

function countCfgFields(obj){
  if (obj === null || typeof obj !== 'object' || Array.isArray(obj)) return 1;
  return Object.keys(obj).reduce((n, k) => {
    const v = obj[k];
    if (v && typeof v === 'object' && !Array.isArray(v)) return n + countCfgFields(v);
    return n + 1;
  }, 0);
}
function cfgRow(key, v, ro){
  let control, dtype = 'str';
  const disabled = ro ? ' disabled style="background:var(--surface);color:var(--muted);"' : '';
  if (typeof v === 'boolean') {
    dtype = 'bool';
    control = '<label class="switch" style="transform:scale(.9);"><input type="checkbox" data-path="' + escAttr(key) + '" data-type="bool"' + (v ? ' checked' : '') + (ro ? ' disabled' : '') + '><span></span></label>';
  } else if (typeof v === 'number') {
    dtype = 'num';
    control = '<input data-path="' + escAttr(key) + '" data-type="num" type="number" step="any" value="' + escAttr(v) + '"' + disabled + ' style="width:120px;height:32px;border:1px solid var(--hairline-strong);border-radius:8px;padding:0 10px;font-size:12.5px;">';
  } else if (Array.isArray(v)) {
    dtype = 'arr';
    control = '<input data-path="' + escAttr(key) + '" data-type="arr" value="' + escAttr(v.map(x => typeof x === 'string' ? x : String(x)).join(', ')) + '"' + disabled + ' style="flex:1;min-width:180px;height:32px;border:1px solid var(--hairline-strong);border-radius:8px;padding:0 10px;font-size:12.5px;" placeholder="逗号分隔">';
  } else {
    const s = String(v);
    if (s.length > 80) {
      control = '<textarea data-path="' + escAttr(key) + '" data-type="str"' + (ro ? ' disabled' : '') + ' rows="3" style="flex:1;min-width:220px;border:1px solid var(--hairline-strong);border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.5;font-family:inherit;resize:vertical;background:var(--canvas);color:var(--ink);">' + escHtml(s) + '</textarea>';
    } else {
      control = '<input data-path="' + escAttr(key) + '" data-type="str" value="' + escAttr(s) + '"' + disabled + ' style="flex:1;min-width:180px;height:32px;border:1px solid var(--hairline-strong);border-radius:8px;padding:0 10px;font-size:12.5px;">';
    }
  }

  const label = key.split('.').pop();
  // 死参数标注：代码未消费的配置（Web 端无引用）→ 置灰 + 提示
  const isDead = (window.DEAD_KEYS || []).some(dk => key === dk || key.startsWith(dk + '.'));
  if (isDead) {
    return '<div class="cfg-card ro" style="opacity:.6;"><span class="cfg-label" title="' + escAttr(key) + '">' + escHtml(label) + ' <span style="color:var(--warning);font-size:11px;font-weight:400;">（未使用）</span></span>' +
      '<span style="font-size:11px;color:var(--muted);">Web 端未消费该参数</span></div>';
  }
  const isNote = label === '用途' || label.endsWith('说明') || label === '用途说明';
  if (isNote) {
    return '<div class="cfg-note"><div class="cfg-label">' + escHtml(label) + '</div>' +
      (typeof v === 'string' && v.length > 40
        ? '<textarea data-path="' + escAttr(key) + '" data-type="str" disabled rows="2" style="width:100%;box-sizing:border-box;border:1px solid var(--hairline-strong);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.5;font-family:inherit;resize:none;background:var(--surface);color:var(--steel);">' + escHtml(v) + '</textarea>'
        : '<div style="font-size:12px;color:var(--steel);line-height:1.5;">' + escHtml(String(v)) + '</div>') + '</div>';
  }

  const isWide = control.indexOf('textarea') >= 0;
  return '<div class="cfg-card' + (isWide ? ' col' : '') + (ro ? ' ro' : '') + '"><span class="cfg-label" title="' + escAttr(key) + '">' + escHtml(label) + (ro ? ' <span style="color:var(--muted);font-size:11px;font-weight:400;">(只读)</span>' : '') + '</span>' + control + '</div>';
}
function tomlEscapeStr(s){
  return '"' + String(s).replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\n/g, '\\n').replace(/\r/g, '\\r') + '"';
}
function cfgValToToml(v){
  if (typeof v === 'boolean') return v ? 'true' : 'false';
  if (typeof v === 'number') return String(v);
  return tomlEscapeStr(String(v));
}
async function saveConfig(){
  const st = document.getElementById('cfgStatus');
  if (st) { st.textContent = '正在收集修改…'; st.style.color = 'var(--slate)'; }
  try {
    const updates = {}, deletes = [];
    document.querySelectorAll('#content [data-path]').forEach(el => {
      if (el.disabled) return;
      const path = el.dataset.path, type = el.dataset.type;
      if (type === 'bool') updates[path] = el.checked;
      else if (type === 'num') {
        // 空输入表示保留当前配置，避免无意写入 0（DXF 间隔/比例会失效）。
        if (el.value !== '') updates[path] = Number(el.value);
      }
      else if (type === 'arr') updates[path] = el.value.split(',').map(s => s.trim()).filter(Boolean).map(s => /^\d+(\.\d+)?$/.test(s) ? Number(s) : s);
      else if (el.dataset.state !== undefined) {
        // 状态映射行：input=范围key、data-state=状态值；key 修改 → 新key写 updates + 旧key delete（原子替换）
        const oldKey = path.split('.').pop();
        const nk = el.value.trim();
        if (nk && nk !== oldKey) {
          updates[path.slice(0, path.length - oldKey.length) + nk] = el.dataset.state;
          deletes.push(path);
        }
      }
      else updates[path] = el.value;
    });
    const r = await apiPut('/db/' + API_STATE.dbId + '/config', { updates, deletes });
    if (st) {
      st.textContent = '✓ 已保存 ' + (r.applied || 0) + ' 项' + ((r.missing || []).length ? '，未识别 ' + r.missing.length + ' 项（表数组只读）' : '') + ' · 备份 ' + (r.backup || '') + ' · 保留注释';
      st.style.color = 'var(--success)';
    }
    showToast('配置已保存（保留注释），复核口径已更新', 'info');
  } catch (e) {
    if (st) { st.textContent = '✗ 保存失败：' + ((e && e.message) || e); st.style.color = 'var(--error)'; }
  }
}
