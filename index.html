<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>理反 Web · 理正地层复核数据管理平台</title>
<style>
:root {
  --primary: #0071e3;
  --primary-pressed: #0066cc;
  --navy: #000000;
  --canvas: #ffffff;
  --surface: #f5f5f7;
  --surface-soft: #fafafc;
  --hairline: #e5e5ea;
  --hairline-strong: #c7c7cc;
  --ink: #1d1d1f;
  --charcoal: #3a3a3c;
  --slate: #6e6e73;
  --steel: #8e8e93;
  --muted: #aeaeb2;
  --on-dark: #ffffff;
  --on-dark-muted: #a1a1a6;
  --success: #34c759;
  --warning: #ff9f0a;
  --error: #ff3b30;
  --tint-lavender: #f2f2f7;
  --tint-sky: #e8f1fc;
  --tint-mint: #e8f8ee;
  --tint-peach: #fff2e8;
  --tint-yellow: #fff8e6;
  --tint-yellow-bold: #ffd60a;
  --radius-md: 12px;
  --radius-lg: 16px;
  --shadow-card: 0 8px 30px rgba(0,0,0,.06), 0 1px 3px rgba(0,0,0,.04);
}}
:root[data-theme="dark"] {
  --canvas: #000000;
  --surface: #1c1c1e;
  --surface-soft: #2c2c2e;
  --hairline: #3a3a3c;
  --hairline-strong: #48484a;
  --ink: #f5f5f7;
  --charcoal: #d1d1d6;
  --slate: #98989d;
  --steel: #8e8e93;
  --muted: #636366;
  --on-dark: #ffffff;
  --on-dark-muted: #a1a1a6;
  --tint-lavender: #26262a;
  --tint-sky: #12263a;
  --tint-mint: #0f2a1a;
  --tint-peach: #2a1d0f;
  --tint-yellow: #2a2410;
  --shadow-card: 0 8px 30px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4);
}
:root[data-theme="dark"] .topbar { background: rgba(0,0,0,.8); backdrop-filter: blur(12px); }
:root[data-theme="dark"] .ws-panel, :root[data-theme="dark"] .ws-stat,
:root[data-theme="dark"] .stat-card, :root[data-theme="dark"] .card,
:root[data-theme="dark"] .ws-tool-card .card { background: #1c1c1e; }
:root[data-theme="dark"] .login-brand { background: #000; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; color: var(--ink); background: var(--canvas); -webkit-font-smoothing: antialiased; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }
input, select, textarea { font-family: inherit; font-size: 14px; color: var(--ink); }
a { color: var(--primary); text-decoration: none; }
a:hover { text-decoration: underline; }

.login-wrap { display: flex; min-height: 100vh; }
.login-brand { flex: 0 0 690px; background: var(--navy); padding: 64px; color: var(--on-dark); display: flex; flex-direction: column; gap: 20px; }
.login-brand .logo { display: flex; align-items: center; gap: 12px; }
.login-brand .logo-box { width: 36px; height: 36px; border-radius: 9px; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px; }
.login-brand .logo-text { font-size: 20px; font-weight: 600; }
.login-brand .badge { display: inline-block; background: var(--primary); color: #fff; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; width: max-content; }
.login-brand h1 { font-size: 42px; font-weight: 700; line-height: 1.24; max-width: 480px; }
.login-brand .sub { color: var(--on-dark-muted); font-size: 15px; line-height: 1.6; max-width: 480px; }
.login-brand .features { display: flex; flex-direction: column; gap: 18px; margin-top: 24px; }
.login-brand .feat-row { display: flex; align-items: center; gap: 12px; font-size: 14px; }
.login-brand .feat-row svg { flex: 0 0 24px; }
.login-form-area { flex: 1; display: flex; align-items: center; justify-content: center; padding: 48px; }
.login-form { width: 400px; display: flex; flex-direction: column; gap: 10px; }
.login-form h2 { font-size: 28px; font-weight: 600; margin-bottom: 2px; }
.login-form .form-sub { color: var(--steel); font-size: 14px; margin-bottom: 16px; }
.login-form label { font-size: 13px; font-weight: 500; color: var(--charcoal); }
.login-form .input { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 14px; border: 1px solid var(--hairline-strong); border-radius: var(--radius-md); background: #fff; }
.login-form .input input { border: none; outline: none; flex: 1; background: transparent; }
.login-form .input svg { flex: 0 0 20px; color: var(--steel); }
.login-form .opts { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
.login-form .opts .chk { display: flex; align-items: center; gap: 8px; color: var(--slate); }
.login-form .opts .chk-box { width: 16px; height: 16px; border-radius: 4px; background: var(--primary); display: flex; align-items: center; justify-content: center; color: #fff; }
.login-form .opts .forgot { color: var(--primary); font-weight: 500; }
.login-form .btn-login { height: 46px; background: var(--primary); color: #fff; border-radius: var(--radius-md); font-size: 15px; font-weight: 600; margin-top: 8px; }
.login-form .btn-login:hover { background: var(--primary-pressed); }
.login-form .hint { text-align: center; color: var(--steel); font-size: 12px; margin-top: 6px; }
.login-form .err { color: var(--error); font-size: 12px; min-height: 16px; }

.app { display: none; min-height: 100vh; }
.app.show { display: flex; }
.sidebar { flex: 0 0 240px; background: var(--surface); padding: 24px 0; display: flex; flex-direction: column; gap: 4px; }
.sidebar .sb-head { display: flex; align-items: center; gap: 10px; padding: 0 24px 12px; }
.sidebar .sb-logo { width: 28px; height: 28px; background: var(--primary); border-radius: 7px; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; }
.sidebar .sb-name { font-size: 16px; font-weight: 600; }
.sidebar .sb-section { padding: 16px 24px 4px; font-size: 11px; font-weight: 600; color: var(--steel); letter-spacing: 1px; text-transform: uppercase; }
.nav-item { display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 24px; color: var(--slate); font-size: 14px; cursor: pointer; }
.nav-item:hover { background: rgba(0,0,0,.04); }
.nav-item { margin: 2px 12px; padding: 0 14px; border-radius: 10px; height: 38px; }
.nav-item:hover { background: rgba(0,0,0,.05); }
.nav-item.active { background: #e8f1fc; color: var(--primary); font-weight: 600; }
.nav-item svg { flex: 0 0 24px; }

.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.topbar { height: 64px; background: var(--canvas); border-bottom: 1px solid var(--hairline); display: flex; align-items: center; justify-content: space-between; padding: 0 32px; gap: 16px; }
.topbar .crumb { font-size: 14px; font-weight: 500; }
.topbar .search { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 16px; background: var(--surface); border-radius: 999px; width: 360px; }
.topbar .search input { background: transparent; border: none; outline: none; flex: 1; }
.topbar .user-area { display: flex; align-items: center; gap: 12px; }
.topbar .avatar { display: flex; align-items: center; gap: 8px; padding: 0 12px; height: 36px; background: var(--tint-lavender); border-radius: 18px; }
.topbar .avatar .av-img { width: 28px; height: 28px; background: var(--primary); border-radius: 14px; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; }
.topbar .avatar span { font-size: 13px; font-weight: 500; color: var(--charcoal); }
.topbar .bell { width: 36px; height: 36px; background: var(--surface); border-radius: 8px; display: flex; align-items: center; justify-content: center; }

.content { flex: 1; padding: 32px; overflow-y: auto; }
.content h1.page-title { font-size: 26px; font-weight: 700; margin-bottom: 6px; }
.content .page-sub { color: var(--steel); font-size: 13px; margin-bottom: 20px; }

.card { background: var(--canvas); border: 1px solid var(--hairline); border-radius: var(--radius-lg); padding: 22px; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 18px; border-radius: 999px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all .18s; }
.btn-primary { background: var(--primary); color: #fff; box-shadow: 0 2px 8px rgba(0,113,227,.25); }
.btn-primary:hover { background: var(--primary-pressed); transform: translateY(-1px); }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-pressed); }
.btn-secondary { background: #fff; color: var(--charcoal); border: 1px solid var(--hairline-strong); }
.btn-secondary:hover { background: var(--surface); }
.btn-danger { color: var(--error); background: #fff; border: 1px solid var(--hairline-strong); }
.btn-link { color: var(--primary); font-weight: 500; }

.stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
.stat-card { background: var(--canvas); border: 1px solid var(--hairline); border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow-card); }
.stat-card .stat-head { display: flex; justify-content: space-between; align-items: center; }
.stat-card .stat-head .label { font-size: 13px; font-weight: 500; color: var(--steel); }
.stat-card .stat-head .ic { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
.stat-card .val { font-size: 30px; font-weight: 700; color: var(--ink); }
.stat-card .sub { font-size: 12px; color: var(--steel); }
.stat-card .sub.ok { color: var(--success); }

.welcome { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.welcome .welcome-r { display: flex; gap: 10px; }

.toolbar { background: var(--surface); border-radius: var(--radius-lg); padding: 6px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 12px; height: 56px; }
.tabs { display: flex; height: 100%; }
.tab { display: flex; align-items: center; padding: 0 14px; height: 100%; color: var(--slate); font-size: 13px; cursor: pointer; }
.tab.active { color: var(--ink); font-weight: 600; border-bottom: 2px solid var(--primary); }
.tab:hover { color: var(--ink); }
.t-tools { display: flex; gap: 10px; align-items: center; }
.search-in { display: flex; align-items: center; gap: 6px; width: 240px; height: 38px; padding: 0 10px; background: #fff; border: 1px solid var(--hairline-strong); border-radius: var(--radius-md); }
.search-in input { border: none; outline: none; flex: 1; background: transparent; font-size: 13px; }

.table-card { background: #fff; border: 1px solid var(--hairline); border-radius: var(--radius-lg); overflow: hidden; }
.t-head, .t-row { display: grid; align-items: center; }
.t-head { background: var(--surface-soft); height: 44px; padding: 0 20px; font-size: 12px; font-weight: 600; color: var(--steel); }
.t-row { padding: 0 20px; min-height: 52px; border-bottom: 1px solid var(--hairline); font-size: 13px; }
.t-row:last-child { border-bottom: none; }
.t-row .name { font-weight: 500; color: var(--ink); }
.status-pill { display: inline-flex; align-items: center; gap: 4px; padding: 0 10px; height: 24px; border-radius: 12px; font-size: 12px; font-weight: 500; }
.status-pill.ok { background: var(--tint-mint); color: var(--success); }
.status-pill.warn { background: var(--tint-yellow); color: var(--warning); }
.status-pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

.pager { display: flex; justify-content: space-between; align-items: center; height: 56px; padding: 0 20px; background: var(--surface-soft); font-size: 13px; color: var(--steel); }
.pager .pages { display: flex; gap: 4px; }
.pager .pages button { width: 32px; height: 32px; border-radius: 6px; background: #fff; border: 1px solid var(--hairline-strong); cursor: pointer; color: var(--charcoal); }
.pager .pages button.active { background: var(--primary); color: #fff; border-color: var(--primary); }

.banner { background: var(--navy); color: var(--on-dark); border-radius: 14px; padding: 28px 40px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.banner h2 { font-size: 28px; font-weight: 700; }
.banner p { color: var(--on-dark-muted); font-size: 13px; max-width: 620px; margin-top: 8px; }
.banner .right { display: flex; align-items: center; gap: 12px; }
.banner .ic-circle { width: 56px; height: 56px; border-radius: 14px; background: var(--primary); display: flex; align-items: center; justify-content: center; }

.config-card { background: #fff; border: 1px solid var(--hairline); border-radius: var(--radius-lg); padding: 24px; margin-bottom: 20px; }
.config-card h3 { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
.formats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
.format { padding: 16px; border-radius: 10px; background: var(--surface-soft); border: 1px solid var(--hairline); cursor: pointer; }
.format.active { background: var(--tint-lavender); border: 2px solid var(--primary); }
.format .ft { font-size: 16px; font-weight: 700; margin-bottom: 4px; color: var(--ink); }
.format.active .ft { color: var(--primary); }
.format .fs { font-size: 12px; color: var(--slate); }
.main-action { display: flex; justify-content: space-between; align-items: center; background: var(--surface-soft); padding: 20px; border-radius: 10px; }
.main-action .left strong { display: block; font-size: 14px; margin-bottom: 4px; }
.main-action .left p { font-size: 12px; color: var(--steel); }

.banner-status { background: var(--tint-mint); border-radius: 12px; padding: 0 28px; height: 90px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.banner-status h3 { color: var(--success); font-size: 17px; font-weight: 600; margin-bottom: 4px; }
.banner-status p { color: var(--charcoal); font-size: 13px; }
.banner-status .right { color: var(--success); font-weight: 600; display: flex; align-items: center; gap: 8px; }

.policy-card { background: #fff; border: 1px solid var(--hairline); border-radius: var(--radius-lg); padding: 24px; display: flex; gap: 32px; }
.policy-card h3 { font-size: 16px; font-weight: 600; margin-bottom: 14px; }
.switch-row { display: flex; justify-content: space-between; align-items: center; background: var(--surface-soft); padding: 14px; border-radius: 8px; margin-top: 4px; }
.switch { width: 40px; height: 22px; background: var(--success); border-radius: 11px; position: relative; cursor: pointer; }
.switch::after { content: ""; position: absolute; right: 2px; top: 2px; width: 18px; height: 18px; background: #fff; border-radius: 50%; }
.setting-row { display: flex; justify-content: space-between; align-items: center; background: var(--surface-soft); padding: 12px 14px; border-radius: 8px; margin-bottom: 8px; }
.setting-row .lbl { color: var(--slate); font-size: 13px; }
.setting-row .val { font-weight: 600; color: var(--ink); font-size: 13px; }

.users-list { background: #fff; border: 1px solid var(--hairline); border-radius: var(--radius-lg); padding: 24px; margin-bottom: 20px; }

.matrix { background: #fff; border: 1px solid var(--hairline); border-radius: var(--radius-lg); padding: 24px; }
.matrix h3 { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
.matrix .m-head, .matrix .m-row { display: grid; align-items: center; }
.matrix .m-head { background: var(--surface-soft); height: 36px; padding: 0 14px; font-size: 12px; font-weight: 600; color: var(--steel); border-radius: 6px; }
.matrix .m-row { padding: 14px; border-radius: 8px; margin-top: 8px; min-height: 56px; font-size: 14px; }
.matrix .m-row.alt { background: var(--surface-soft); }
.matrix .check { display: flex; justify-content: center; }

.modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; z-index: 100; }
.modal-mask.show { display: flex; }
.modal { background: #fff; border-radius: var(--radius-lg); width: 520px; max-width: 90vw; padding: 28px; box-shadow: var(--shadow-card); }
.modal h3 { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
.modal .form-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.modal .form-row label { font-size: 12px; color: var(--slate); }
.modal .form-row input, .modal .form-row select { height: 38px; padding: 0 12px; border: 1px solid var(--hairline-strong); border-radius: var(--radius-md); outline: none; }
.modal .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

@media (max-width: 1024px) {
  .login-wrap { flex-direction: column; }
  .login-brand { flex: none; padding: 40px; }
  .login-form-area { padding: 40px; }
  .stat-row { grid-template-columns: repeat(2, 1fr); }
  .formats { grid-template-columns: 1fr; }
  .topbar .search { display: none; }
}
@media (max-width: 720px) {
  .sidebar { display: none; }
  .stat-row { grid-template-columns: 1fr; }
  .topbar { padding: 0 16px; }
  .content { padding: 16px; }
}

.flex { display: flex; gap: 12px; align-items: center; }
.spacer { flex: 1; }
.muted { color: var(--steel); }
.small { font-size: 12px; }
.toast { position: fixed; top: 20px; right: 20px; background: var(--ink); color: #fff; padding: 12px 20px; border-radius: var(--radius-md); z-index: 200; display: none; }
.toast.show { display: block; }
.toast.err { background: var(--error); }
.toast.ok { background: var(--success); }

.connbar { display: flex; align-items: center; gap: 8px; padding: 8px 32px; font-size: 12px; border-bottom: 1px solid var(--hairline); }
.connbar .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: 0 0 8px; }
.connbar.ok { background: var(--tint-mint); color: var(--success); }
.connbar.ok .dot { background: var(--success); }
.connbar.local { background: var(--surface-soft); color: var(--steel); }
.connbar.local .dot { background: var(--muted); }
.connbar a { margin-left: auto; font-weight: 600; cursor: pointer; }
.pagination { display: flex; align-items: center; justify-content: flex-end; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--hairline); background: var(--surface-soft); border-radius: 0 0 var(--radius-lg) var(--radius-lg); }
.pagination .pg-info { color: var(--steel); font-size: 12px; margin-right: auto; }
.pagination select { border: 1px solid var(--hairline-strong); border-radius: 6px; padding: 4px 6px; background: #fff; color: var(--ink); }
.build-actions { display: flex; gap: 12px; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--hairline-strong); }


.ws-head { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 18px; }
.ws-title { font-size: 32px; font-weight: 700; letter-spacing: -0.5px; color: var(--ink); line-height: 1.1; }
.ws-sub { color: var(--slate); font-size: 14px; margin-top: 4px; }
.ws-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 18px; }
.ws-stat { background: #fff; border: 1px solid var(--hairline); border-radius: 16px; padding: 16px 18px; box-shadow: var(--shadow-card); }
.ws-stat .lbl { font-size: 12px; color: var(--steel); font-weight: 600; letter-spacing: .3px; }
.ws-stat .num { font-size: 26px; font-weight: 700; margin-top: 4px; letter-spacing: -0.5px; }
.ws-stat .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.ws-grid { display: grid; grid-template-columns: 250px 1fr 320px; gap: 14px; align-items: start; }
.ws-panel { background: #fff; border: 1px solid var(--hairline); border-radius: 16px; box-shadow: var(--shadow-card); overflow: hidden; }
.ws-panel .p-head { padding: 12px 16px; border-bottom: 1px solid var(--hairline); font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
.ws-hole { padding: 8px 14px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 13px; border-bottom: 1px solid #f0f0f2; }
.ws-hole:hover { background: var(--surface-soft); }
.ws-hole.active { background: #e8f1fc; color: var(--primary); font-weight: 600; }
.ws-badge { font-size: 10px; padding: 1px 7px; border-radius: 999px; color: #fff; font-weight: 600; margin-left: 4px; }
.ws-badge.h { background: var(--error); }
.ws-badge.m { background: var(--warning); }
.ws-issue { padding: 10px 14px; border-bottom: 1px solid #f0f0f2; font-size: 12.5px; }
.ws-issue .rid { font-weight: 700; margin-right: 6px; }
.ws-issue .msg { color: var(--charcoal); }
.ws-issue .fld { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
.ws-toolbar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--hairline); flex-wrap: wrap; }
.ws-empty { padding: 48px 20px; text-align: center; color: var(--steel); font-size: 14px; }
.ws-upload { max-width: 640px; margin: 60px auto; text-align: center; }
.ws-upload .big { font-size: 40px; font-weight: 700; letter-spacing: -0.8px; margin-bottom: 10px; }
.ws-upload .drop { margin: 28px auto; padding: 48px 24px; border: 2px dashed var(--hairline-strong); border-radius: 20px; background: var(--surface-soft); cursor: pointer; transition: all .2s; }
.ws-upload .drop:hover { border-color: var(--primary); background: #eef6ff; }
.ws-tool-card { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.ws-tool-card .card { background: #fff; border: 1px solid var(--hairline); border-radius: 16px; padding: 18px; box-shadow: var(--shadow-card); cursor: pointer; transition: transform .15s, box-shadow .15s; }
.ws-tool-card .card:hover { transform: translateY(-2px); box-shadow: 0 12px 34px rgba(0,0,0,.08); }
.ws-tool-card .card .t { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
.ws-tool-card .card .d { font-size: 12.5px; color: var(--slate); line-height: 1.5; }

<script>
const DB_NAME = 'lifan_web_db';
const DB_VERSION = 1;
const TABLES = ['zk_boreholes','dz_strata','dt_dynamic','sj_lab','rb_daily','users','backups','audit_logs','config'];

let db = null;
function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      TABLES.forEach(t => {
        if (!d.objectStoreNames.contains(t)) {
          if (t === 'zk_boreholes') d.createObjectStore(t, { keyPath: 'id', autoIncrement: true }).createIndex('borehole_no','borehole_no',{unique:false});
          else if (t === 'users') d.createObjectStore(t, { keyPath: 'id', autoIncrement: true }).createIndex('username','username',{unique:true});
          else d.createObjectStore(t, { keyPath: 'id', autoIncrement: true });
        }
      });
    };
    req.onsuccess = e => { db = e.target.result; resolve(db); };
    req.onerror = e => reject(e);
  });
}
function dao(store, mode){ return db.transaction(store, mode).objectStore(store); }
async function dbAll(store){ return new Promise(r => { const q = dao(store,'readonly').getAll(); q.onsuccess = () => r(q.result || []); }); }
async function dbGet(store, key){ return new Promise(r => { const q = dao(store,'readonly').get(key); q.onsuccess = () => r(q.result); }); }
async function dbPut(store, row){ return new Promise(r => { row.updated_at = new Date().toISOString(); const q = dao(store,'readwrite').put(row); q.onsuccess = () => r(q.result); }); }
async function dbDel(store, key){ return new Promise(r => { const q = dao(store,'readwrite').delete(key); q.onsuccess = () => r(); }); }

async function sha256(s){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s + '_lifan_salt'));
  return Array.from(new Uint8Array(buf)).map(x => x.toString(16).padStart(2,'0')).join('');
}



function toggleTheme(){
  const root = document.documentElement;
  const dark = root.getAttribute('data-theme') !== 'dark';
  root.setAttribute('data-theme', dark ? 'dark' : '');
  localStorage.setItem('lifan_theme', dark ? 'dark' : 'light');
}
(function(){
  const t = localStorage.getItem('lifan_theme');
  if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  else if (!t && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
})();
function getToken(){ return localStorage.getItem('lifan_token') || ''; }
function setToken(t){ if (t) localStorage.setItem('lifan_token', t); else localStorage.removeItem('lifan_token'); }
const API_STATE = {
  online: false,        // 后端 /api 可达
  checked: false,       // 已完成健康探测
  dbId: null,           // 在线工作库 db_id
  dbName: '',           // 上传的原始文件名
  dbSize: 0,            // 上传文件字节数
  tables: null,         // {表名: 行数}（上传时快照）
};

function loadApiState(){
  try {
    const s = JSON.parse(localStorage.getItem('lifan_api_state') || 'null');
    if (s && s.dbId) {
      API_STATE.dbId = s.dbId; API_STATE.dbName = s.dbName || '';
      API_STATE.dbSize = s.dbSize || 0; API_STATE.tables = s.tables || null;
    }
  } catch (e) { /* 本地缓存损坏则忽略 */ }
}
function saveApiState(){
  try {
    localStorage.setItem('lifan_api_state', JSON.stringify({
      dbId: API_STATE.dbId, dbName: API_STATE.dbName,
      dbSize: API_STATE.dbSize, tables: API_STATE.tables,
    }));
  } catch (e) { /* 存储失败忽略 */ }
}
function clearApiState(){
  API_STATE.dbId = null; API_STATE.dbName = ''; API_STATE.dbSize = 0; API_STATE.tables = null;
  try { localStorage.removeItem('lifan_api_state'); } catch (e) {}
}

class ApiError extends Error {
  constructor(msg, status){ super(msg); this.status = status || 0; }
}

async function apiFetch(path, options = {}){
  const url = '/api' + path;
  const timeout = options.timeout || 20000;
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeout);
  let res;
  try {
    const isForm = options.body instanceof FormData;
    const t = getToken();
    const headers = Object.assign({}, options.headers || {});
    if (!isForm && !headers['Content-Type']) headers['Content-Type'] = 'application/json';
    if (t) headers['Authorization'] = 'Bearer ' + t;
    res = await fetch(url, {
      method: options.method || 'GET',
      headers,
      body: options.body === undefined ? undefined : (isForm ? options.body : JSON.stringify(options.body)),
      signal: ctrl.signal,
    });
  } catch (e) {
    const msg = e && e.name === 'AbortError' ? '请求超时，请稍后重试' : '无法连接后端服务（' + url + '）';
    if (!options.silent) showToast(msg, 'err');
    throw new ApiError(msg);
  } finally { clearTimeout(timer); }
  if (res.status === 401) {
    setToken('');
    showToast('登录已过期，请重新登录', 'err');
    const lp = document.getElementById('loginPage');
    if (lp) { lp.style.display = 'flex'; }
    const ap = document.getElementById('app');
    if (ap) ap.classList.remove('show');
    throw new ApiError('未登录或登录已过期', 401);
  }
  if (!res.ok) {
    let msg = '请求失败（HTTP ' + res.status + '）';
    try {
      const j = await res.json();
      if (j && j.detail !== undefined) msg = typeof j.detail === 'string' ? j.detail : JSON.stringify(j.detail);
    } catch (e) { /* 非 JSON 错误体 */ }
    if (!options.silent) showToast(msg, 'err');
    throw new ApiError(msg, res.status);
  }
  if (res.status === 204) return null;
  const ct = (res.headers.get('content-type') || '').toLowerCase();
  return ct.includes('application/json') ? res.json() : res;
}
function apiGet(path, opts){ return apiFetch(path, opts || {}); }
function apiPost(path, body, opts){ return apiFetch(path, Object.assign({ method: 'POST', body }, opts || {})); }
function apiPut(path, body, opts){ return apiFetch(path, Object.assign({ method: 'PUT', body }, opts || {})); }
function apiDelete(path, opts){ return apiFetch(path, Object.assign({ method: 'DELETE' }, opts || {})); }
function apiUpload(path, file, opts){
  const fd = new FormData();
  fd.append('file', file);
  return apiFetch(path, Object.assign({ method: 'POST', body: fd, timeout: 120000 }, opts || {}));
}

/* ---- 后端健康探测 / 页面顶部连接状态条 ---- */
async function detectBackend(){
  try {
    const h = await apiFetch('/health', { timeout: 2500, silent: true });
    API_STATE.online = !!(h && h.status === 'ok');
  } catch (e) {
    API_STATE.online = false;   // 静默降级：不弹错误
  }
  API_STATE.checked = true;
  updateConnBar();
  return API_STATE.online;
}
function updateConnBar(){
  const bar = document.getElementById('connBar');
  if (!bar) return;
  if (API_STATE.online) {
    bar.className = 'connbar ok';
    bar.innerHTML = '<span class="dot"></span>在线模式 · 后端健康 ✓' +
      (API_STATE.dbId ? ' · 工作库 <b>db_id=' + API_STATE.dbId + '</b>' : ' · 尚未上传数据库') +
      '<a href="javascript:;" onclick="recheckBackend()">重检连接</a>';
  } else {
    bar.className = 'connbar local';
    bar.innerHTML = '<span class="dot"></span>本地模式 · 后端未连接（IndexedDB 演示数据仍可用）' +
      '<a href="javascript:;" onclick="recheckBackend()">检测后端</a>';
  }
  bar.hidden = false;
}
async function recheckBackend(){
  await detectBackend();
  const r = (location.hash || '').replace('#', '');
  if (ROUTES.includes(r)) route(r); else render('mdb');
}
function fmtSize(n){
  if (n == null) return '—';
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1048576).toFixed(2) + ' MB';
}
function ts(){ return new Date().toTimeString().slice(0, 8); }
function escHtml(s){ return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function escAttr(s){ return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }
function qsName(form, name){ return form.querySelector('[name="' + String(name).replace(/"/g, '\\"') + '"]'); }

async function seed(){
  const users = await dbAll('users');
  if (users.length === 0) {
    await dbPut('users', {username:'admin',   display_name:'管理员 · Geo-Le', email:'geo-le@lifan.com', role:'admin',  password_hash: await sha256('admin'),  status:'active', last_login: new Date().toISOString()});

    await dbPut('users', {username:'viewer',  display_name:'访客',           email:'viewer@lifan.com', role:'viewer', password_hash: await sha256('viewer'), status:'active'});

let session = null;
const PERMISSIONS = {
  admin:  {data_query:true, data_edit:true, data_delete:true, db_export:true, backup:true, user_manage:true},
  editor: {data_query:true, data_edit:true, data_delete:true, db_export:true, backup:true, user_manage:false},

  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  setTimeout(() => t.className = 'toast', 2200);

  errEl.textContent = '';
  if (!u || !p) { errEl.textContent = '请输入用户名和密码'; return; }

    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p })
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.token) { errEl.textContent = j.detail || '用户名或密码错误'; return; }
    setToken(j.token);
    session = { id: 1, username: u, display_name: u, role: 'admin' };

    route('workspace');

  } catch (ex) {
    errEl.textContent = '无法连接后端服务（' + (ex && ex.message || ex) + '）';

function doExport(){
  if (!can('db_export')) return showToast('当前角色无导出权限','err');
  Promise.all(TABLES.filter(t=>!['audit_logs','backups'].includes(t)).map(async t => [t, await dbAll(t)])).then(async results => {
    const map = Object.fromEntries(results);
    let blob, filename, mime;
    if (exportFormat === 'sql') {
      const sql = generateSQL(map);
      blob = new Blob([sql], {type:'application/sql'});
      filename = `lifan_export_${dateStr()}.sql`;
    } else if (exportFormat === 'csv') {
      const csv = generateCSV(map);
      blob = new Blob(['\ufeff'+csv], {type:'text/csv'});
      filename = `lifan_export_${dateStr()}.csv`;
    } else {
      const json = JSON.stringify({meta:{tool:'理反 Web', version:'V3.0.4-web', exported_at:new Date().toISOString()}, tables:map}, null, 2);
      blob = new Blob([json], {type:'application/json'});
      filename = `lifan_export_${dateStr()}.json`;
    }
    downloadBlob(blob, filename);
    await dbPut('audit_logs', {user_id:session.id, action:'export', table_name:'*', detail:`导出 ${exportFormat.toUpperCase()} · ${filename}`, created_at:new Date().toISOString()});

function quickExport(){ route('build'); }
function generateSQL(map){
  let s = `-- 理反 Web · 数据库导出\n-- 时间：${new Date().toISOString()}\n\n`;
  Object.entries(map).forEach(([t, rows]) => {
    if (!rows.length) return;
    const cols = Object.keys(rows[0]).filter(k => k !== 'updated_at');
    s += `CREATE TABLE IF NOT EXISTS ${t} (\n`;
    s += cols.map(c => `  ${c} ${typeof rows[0][c]==='number'?'REAL':'TEXT'}`).join(',\n');
    s += `\n);\n\n`;
    rows.forEach(r => {
      const vals = cols.map(c => r[c]===null||r[c]===undefined?'NULL':(typeof r[c]==='number'?r[c]:`'${String(r[c]).replace(/'/g,"''")}'`)).join(', ');
      s += `INSERT INTO ${t} (${cols.join(', ')}) VALUES (${vals});\n`;
    });
    s += '\n';
  });
  return s;
}
function generateCSV(map){
  let s = '';
  Object.entries(map).forEach(([t, rows]) => {
    if (!rows.length) return;
    s += `# ${t}\n`;
    const cols = Object.keys(rows[0]);
    s += cols.join(',') + '\n';
    rows.forEach(r => s += cols.map(c => `"${String(r[c]??'').replace(/"/g,'""')}"`).join(',') + '\n');
    s += '\n';
  });
  return s;
}
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
function dateStr(){ return new Date().toISOString().replace(/[:.]/g,'-').slice(0,19); }

function openUserEdit(id){
  document.getElementById('modalTitle').textContent = id ? '编辑用户' : '添加用户';
  document.getElementById('modalForm').innerHTML = `
    <div class="form-row"><label>用户名</label><input name="username" required ${id?'readonly':''}></div>
    <div class="form-row"><label>显示名</label><input name="display_name"></div>
    <div class="form-row"><label>邮箱</label><input name="email" type="email"></div>
    <div class="form-row"><label>角色</label><select name="role"><option value="viewer">只读</option><option value="editor">编辑员</option><option value="admin">管理员</option></select></div>
    <div class="form-row"><label>密码</label><input name="password" placeholder="${id?'留空则不修改':'至少 6 位'}"></div>
  `;
  if (id) dbGet('users', id).then(u => {
    document.querySelector('[name=display_name]').value = u.display_name||'';
    document.querySelector('[name=email]').value = u.email||'';
    document.querySelector('[name=role]').value = u.role;
    document.querySelector('[name=username]').value = u.username;
  });
  document.getElementById('modalMask').classList.add('show');
  document.getElementById('modalOk').onclick = async () => {
    const f = document.getElementById('modalForm');
    const username = f.querySelector('[name=username]').value.trim();
    const pwd = f.querySelector('[name=password]').value;
    if (!username) return showToast('用户名必填','err');
    if (!id && pwd.length < 6) return showToast('密码至少 6 位','err');
    let row = id ? await dbGet('users', id) : {status:'active'};
    row.username = username;
    row.display_name = f.querySelector('[name=display_name]').value || username;
    row.email = f.querySelector('[name=email]').value;
    row.role = f.querySelector('[name=role]').value;
    if (pwd) row.password_hash = await sha256(pwd);
    if (!id) row.password_hash = row.password_hash || await sha256('changeme');
    await dbPut('users', row);
    showToast(id?'已保存':'已添加');
    document.getElementById('modalMask').classList.remove('show');
    renderUsers();
  };
}
async function resetPwd(id){
  const newPwd = prompt('输入新密码（至少 6 位）：');
  if (!newPwd || newPwd.length < 6) return showToast('密码至少 6 位','err');
  const u = await dbGet('users', id);
  u.password_hash = await sha256(newPwd);
  await dbPut('users', u);
  showToast('密码已重置');
}
async function toggleUser(id){
  const u = await dbGet('users', id);
  if (u.username === session.username) return showToast('不能禁用自己的账号','err');
  u.status = u.status==='active' ? 'disabled' : 'active';
  await dbPut('users', u);
  showToast('已' + (u.status==='active'?'启用':'禁用'));
  renderUsers();
}

}

function fmtNum(v){
  if (v === null || v === undefined || v === '') return '';
  if (typeof v === 'number') {
    if (!isFinite(v)) return String(v);
    if (Number.isInteger(v)) return String(v);
    return String(Math.round(v * 1000) / 1000);
  }
  if (typeof v === 'string') {
    const t = v.trim();
    if (t === '') return '';
    const n = Number(t);
    if (!isNaN(n) && /^[+-]?\d+(\.\d+)?$/.test(t)) {
      if (Number.isInteger(n)) return String(n);
      return String(Math.round(n * 1000) / 1000);
    }
    return v;
  }
  return String(v);
}

    API_STATE.dbSize = r.size || 0; API_STATE.tables = r.tables || {};
    saveApiState(); updateConnBar();
    showToast('上传成功：' + Object.keys(API_STATE.tables).length + ' 张表', 'info');
    location.hash = '#workspace'; renderWorkspace();

    st.textContent = '上传失败：' + ((e && e.message) || e); st.style.color = 'var(--error)';

async function wsLoadReview(){
  try {
    const data = await apiPost(wsReviewQuery(), {});
    WS.review = data;
    const s = data.summary || {};
    const holes = document.getElementById('wsS0'), risk = document.getElementById('wsS1'),
          h = document.getElementById('wsS2'), total = document.getElementById('wsS3');
    if (holes) holes.textContent = s.holes || 0;
    if (risk) risk.textContent = Object.keys(data.by_hole || {}).filter(k => data.by_hole[k].h || data.by_hole[k].m).length;
    if (h) h.textContent = s.h || 0;
    if (total) total.textContent = s.total || 0;
    const cnt = document.getElementById('wsHoleCount');
    if (cnt) cnt.textContent = (s.holes || 0) + ' 孔';
    // 钻孔列表：问题孔优先
    const by = data.by_hole || {};
    const risky = Object.keys(by).filter(k => by[k].h || by[k].m).sort();
    const clean = Object.keys(by).filter(k => !(by[k].h || by[k].m)).sort();
    const box = document.getElementById('wsHoles');
    if (box) {
      box.innerHTML = risky.map(zk => wsHoleItem(zk, by[zk])).join('')
        + (clean.length ? '<div style="padding:8px 14px;font-size:11px;color:var(--muted);font-weight:600;">通过 · ' + clean.length + ' 孔</div>' : '')
        + clean.slice(0, 40).map(zk => wsHoleItem(zk, by[zk])).join('')
        + (clean.length > 40 ? '<div style="padding:8px 14px;font-size:11px;color:var(--muted);">…共 ' + clean.length + ' 孔</div>' : '');
      // 默认选中第一个问题孔
      const first = risky[0] || clean[0];
      if (first) wsSelectHole(first);
    }
    await wsInitTables();
  } catch (e) {
    showToast('复核失败：' + ((e && e.message) || e), 'err');
  }
}

const STATE_ORDER = ['松散','稍密','中密','密实','流塑','软塑','可塑','硬塑','坚硬','不限制'];
const RANGE_KEY_RE = /^[\d.≤≥<>~×\s-]+$/;
function isStateMap(obj){
  if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return false;
  const keys = Object.keys(obj);
  if (!keys.length) return false;
  const rangeKeys = keys.filter(k => k !== '用途' && RANGE_KEY_RE.test(k));
  return rangeKeys.length >= 2;
}
function renderStateMap(key, obj){
  // 反转展示：状态词为行标签，区间为输入值（data-path 仍用原始区间键，保存逻辑不变）
  const rows = Object.entries(obj).filter(([k]) => k !== '用途');
  const order = {};
  STATE_ORDER.forEach((s, i) => order[s] = i);
  rows.sort((a, b) => (order[a[1]] ?? 99) - (order[b[1]] ?? 99) || String(a[0]).localeCompare(String(b[0]), 'zh'));
  const grid = rows.map(([k, v]) =>
    '<div style="display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid #f0f0f2;">' +
    '<span style="flex:0 0 110px;font-size:13px;font-weight:600;color:var(--charcoal);">' + escHtml(v) + '</span>' +
    '<input data-path="' + escAttr(key + '.' + k) + '" data-type="str" data-state="' + escAttr(v) + '" value="' + escAttr(k) + '" style="flex:1;max-width:220px;height:32px;border:1px solid var(--hairline-strong);border-radius:8px;padding:0 10px;font-size:12.5px;">' +
    '</div>').join('');
  return '<div style="margin:6px 0 2px;font-size:12px;font-weight:700;color:var(--steel);">由状态定义数据（状态 → 数据区间）</div>' + grid;
}
function renderCfgSection(sec, obj, prefix){
  if (Array.isArray(obj) && obj.length && typeof obj[0] === 'object') {
    const base = prefix || sec;
    return obj.map((item, i) =>
      '<div style="background:var(--surface-soft);border-radius:10px;padding:4px 12px 8px;margin:6px 0;">' +
      Object.keys(item).map(sk => cfgRow(base + '_i' + i + '_' + sk, item[sk], true)).join('') + '</div>').join('');
  }
  if (obj === null || typeof obj !== 'object' || Array.isArray(obj)) {
    return cfgRow(prefix || sec, obj);
  }
  return Object.keys(obj).map(k => {
    const v = obj[k];
    const key = prefix ? prefix + '.' + k : k;
    if (v && typeof v === 'object' && !Array.isArray(v)) {
      if (isStateMap(v)) {
        return '<div style="margin:10px 0 4px;font-size:12.5px;font-weight:700;color:var(--charcoal);">' + escHtml(k) + '</div>' + renderStateMap(key, v);
      }
      return '<div style="margin:8px 0 2px;font-size:12px;font-weight:700;color:var(--steel);">' + escHtml(k) + '</div>' + renderCfgSection(sec, v, key);
    }
    return cfgRow(key, v);
  }).join('');
}
function cfgRow(key, v, ro){
  let control, dtype = 'str';
  const disabled = ro ? ' disabled style="background:var(--surface);color:var(--muted);"' : '';
  if (typeof v === 'boolean') {
    dtype = 'bool';
    control = '<label class="switch" style="transform:scale(.9);"><input type="checkbox" data-path="' + escAttr(key) + '" data-type="bool"' + (v ? ' checked' : '') + (ro ? ' disabled' : '') + '><span></span></label>';
  } else if (typeof v === 'number') {
    dtype = 'num';
    control = '<input data-path="' + escAttr(key) + '" data-type="num" type="number" step="any" value="' + escAttr(v) + '"' + disabled + ' style="width:120px;height:32px;border:1px solid var(--hairline-strong);border-radius:8px;padding:0 10px;font-size:12.5px;">';
  } else if (Array.isArray(v)) {
    dtype = 'arr';
    control = '<input data-path="' + escAttr(key) + '" data-type="arr" value="' + escAttr(v.map(x => typeof x === 'string' ? x : String(x)).join(', ')) + '"' + disabled + ' style="flex:1;min-width:180px;height:32px;border:1px solid var(--hairline-strong);border-radius:8px;padding:0 10px;font-size:12.5px;" placeholder="逗号分隔">';
  } else {
    const s = String(v);
    if (s.length > 80) {
      control = '<textarea data-path="' + escAttr(key) + '" data-type="str"' + (ro ? ' disabled' : '') + ' rows="3" style="flex:1;min-width:220px;border:1px solid var(--hairline-strong);border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.5;font-family:inherit;resize:vertical;background:var(--canvas);color:var(--ink);">' + escHtml(s) + '</textarea>';
    } else {
      control = '<input data-path="' + escAttr(key) + '" data-type="str" value="' + escAttr(s) + '"' + disabled + ' style="flex:1;min-width:180px;height:32px;border:1px solid var(--hairline-strong);border-radius:8px;padding:0 10px;font-size:12.5px;">';
    }
  }
  return '<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #f0f0f2;"><span style="flex:0 0 220px;font-size:12.5px;color:var(--charcoal);" title="' + escAttr(key) + '">' + escHtml(key.split('.').pop()) + (ro ? ' <span style="color:var(--muted);font-size:11px;">(只读)</span>' : '') + '</span>' + control + '</div>';
}
function tomlEscapeStr(s){
  return '"' + String(s).replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\n/g, '\\n').replace(/\r/g, '\\r') + '"';
}
function cfgValToToml(v){
  if (typeof v === 'boolean') return v ? 'true' : 'false';
  if (typeof v === 'number') return String(v);
  return tomlEscapeStr(String(v));
}
async function saveConfig(){
  const st = document.getElementById('cfgStatus');
  if (st) { st.textContent = '正在收集修改…'; st.style.color = 'var(--slate)'; }
  try {
    const updates = {};
    document.querySelectorAll('#content [data-path]').forEach(el => {
      if (el.disabled) return;
      const path = el.dataset.path, type = el.dataset.type;
      if (type === 'bool') updates[path] = el.checked;
      else if (type === 'num') updates[path] = el.value === '' ? 0 : Number(el.value);
      else if (type === 'arr') updates[path] = el.value.split(',').map(s => s.trim()).filter(Boolean).map(s => /^\d+(\.\d+)?$/.test(s) ? Number(s) : s);
      else updates[path] = el.dataset.state !== undefined ? el.dataset.state : el.value;
    });
    const r = await apiPut('/db/' + API_STATE.dbId + '/config', { updates });
    if (st) {
      st.textContent = '✓ 已保存 ' + (r.applied || 0) + ' 项' + ((r.missing || []).length ? '，未识别 ' + r.missing.length + ' 项（表数组只读）' : '') + ' · 备份 ' + (r.backup || '') + ' · 保留注释';
      st.style.color = 'var(--success)';
    }
    showToast('配置已保存（保留注释），复核口径已更新', 'info');
  } catch (e) {
    if (st) { st.textContent = '✗ 保存失败：' + ((e && e.message) || e); st.style.color = 'var(--error)'; }
  }
}

async function uploadMdbFile(){

  st.innerHTML = '正在上传并解析…'; st.style.color = 'var(--steel)';

    const r = await apiUpload('/upload', pendingMdbFile);

    API_STATE.dbSize = r.size || 0;

async function loadOnlinePage(page){
  if (!API_STATE.online || !API_STATE.dbId || !OData.table) return;

        + '?page=' + OData.page + '&page_size=' + OData.pageSize;
  if (OData.keyword) q += '&keyword=' + encodeURIComponent(OData.keyword) + '&search_col=' + encodeURIComponent(OData.searchCol) + '&exact=' + (OData.exact ? '1' : '0');
  const info = document.getElementById('onlinePgInfo');
  if (info) info.textContent = '查询中…';
  try {

}

function inlineEdit(cell, rowId, col){
  if (!can('data_edit')) return;
  if (cell.dataset.editing) return;
  const old = cell.textContent;
  cell.dataset.editing = '1';
  const inp = document.createElement('input');
  inp.type = 'text'; inp.value = old;
  inp.style.cssText = 'width:100%;border:none;outline:none;font-size:12.5px;background:transparent;color:var(--ink);';
  cell.textContent = '';
  cell.appendChild(inp);
  inp.focus(); inp.select();
  const finish = async (save) => {
    cell.dataset.editing = '';
    if (!save) { cell.textContent = old; return; }
    const val = inp.value;
    cell.textContent = val;
    try {
      await apiPut('/db/' + API_STATE.dbId + '/table/' + encodeURIComponent(OData.table) + '/' + rowId,
                   { data: (function(){ var d = {}; d[col] = val; return d; })() });
      showToast('已保存', 'info');
      loadOnlinePage(OData.page);
    } catch (e) { cell.textContent = old; showToast('保存失败：' + ((e && e.message) || e), 'err'); }
  };
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') finish(true); if (e.key === 'Escape') finish(false); });
  inp.addEventListener('blur', () => finish(true));
}

function renderOnlineRows(rows){
  OData.rowCache = {};

    .filter(c => !hidden[c]);
  // 岩土名称同义列去重（TCMC/TCYMC 只显示一个，TCMC 优先）
  if (cols.includes('TCMC') && cols.includes('TCYMC')) {
    cols = cols.filter(c => c !== 'TCYMC');
  }
  const grid = document.getElementById('onlineGrid');
  const info = document.getElementById('onlinePgInfo');
  const totalPages = Math.max(1, Math.ceil(OData.total / OData.pageSize));
  if (info) info.textContent = '共 ' + OData.total + ' 条 · 第 ' + OData.page + ' / ' + totalPages + ' 页' + (OData.keyword ? ' · 关键词「' + OData.keyword + '」' : '');
  const prev = document.getElementById('onlinePrev'), next = document.getElementById('onlineNext');
  if (prev) prev.disabled = OData.page <= 1;
  if (next) next.disabled = OData.page >= totalPages;
  const gridColsReal = ['60px'].concat(cols.map(c => 'minmax(' + (WS_COL_WIDE.includes(c) ? 260 : 90) + 'px,' + (WS_COL_WIDE.includes(c) ? '3fr' : '1fr') + ')')).join(' ');
  const minW = Math.max(640, cols.length * 90 + 160);
  const head = '<div class="t-head" style="grid-template-columns:' + gridColsReal + ';height:36px;padding:0 14px;background:var(--surface-soft);min-width:' + minW + 'px;"><div>#</div>' + cols.map(c => '<div style="font-weight:600;font-size:12px;">' + escHtml(COLUMN_CN[c] || c) + '</div>').join('') + '<div>操作</div></div>';
  const body = rows.length ? rows.map(row => {
    const idJs = JSON.stringify(row.id == null ? '' : row.id).replace(/"/g, '');
    OData.rowCache[String(row.id)] = row;
    return '<div class="t-row" style="grid-template-columns:' + gridColsReal + ';padding:0 14px;min-width:' + minW + 'px;">' +
      '<div class="muted">' + (row.id == null ? '—' : escHtml(row.id)) + '</div>' +
      cols.map(c => '<div style="font-size:12.5px;cursor:pointer;' + (WS_COL_WIDE.includes(c) ? 'white-space:normal;line-height:1.45;' : '') + '" title="点击编辑" onclick="inlineEdit(this, ' + idJs + ', \'' + c + '\')">' + escHtml(fmtNum(row[c])) + '</div>').join('') +
      '<div>' +
        (can('data_edit') ? '<a class="btn-link" href="javascript:openOnlineEditById(' + idJs + ')">编辑</a>' : '') +
        (can('data_edit') && can('data_delete') ? ' · ' : '') +
        (can('data_delete') ? '<a class="btn-link" style="color:var(--error)" href="javascript:delOnlineRow(' + idJs + ')">删除</a>' : '') +
      '</div></div>';
  }).join('') : '<div style="padding:32px;text-align:center;color:var(--steel);">' + (OData.keyword ? '无匹配结果' : '暂无数据') + '</div>';
  if (grid) grid.innerHTML = '<div style="min-width:100%;">' + head + body + '</div>';
}

function openOnlineEdit(row){
  if (!can('data_edit')) return showToast('当前角色无编辑权限', 'err');
  const cols = (OData.columns || []).filter(c => c !== 'id');
  const form = document.getElementById('modalForm');
  document.getElementById('modalTitle').textContent = row ? '编辑数据 · ' + OData.table : '新增数据 · ' + OData.table;
  form.innerHTML = cols.map(c =>
    '<div class="form-row"><label>' + escHtml(c) + '</label><input name="' + escAttr(c) + '" value="' + (row ? escAttr(row[c] ?? '') : '') + '" style="height:38px;border:1px solid var(--hairline-strong);border-radius:var(--radius-md);padding:0 10px;"></div>'
  ).join('') + '<p class="muted small" style="margin-top:4px;">注：id 为服务端主键，不可编辑；保存后立即写回在线工作库。</p>';
  document.getElementById('modalMask').classList.add('show');
  document.getElementById('modalOk').onclick = async () => {
    const data = {};
    cols.forEach(c => { const el = qsName(form, c); data[c] = el ? el.value : ''; });
    try {
      if (row) {
        await apiPut('/db/' + encodeURIComponent(API_STATE.dbId) + '/table/' + encodeURIComponent(OData.table) + '/' + encodeURIComponent(row.id), { data });
      } else {
        await apiPost('/db/' + encodeURIComponent(API_STATE.dbId) + '/table/' + encodeURIComponent(OData.table), { data });
      }
      document.getElementById('modalMask').classList.remove('show');
      showToast(row ? '已保存' : '已新增');
      loadOnlinePage(row ? OData.page : 1);
    } catch (e) { /* 错误已由 apiFetch toast */ }
  };
}
async function delOnlineRow(id){
  if (!can('data_delete')) return showToast('当前角色无删除权限', 'err');
  if (!confirm('确认删除该条数据？删除后不可恢复。')) return;
  try {
    await apiDelete('/db/' + encodeURIComponent(API_STATE.dbId) + '/table/' + encodeURIComponent(OData.table) + '/' + encodeURIComponent(id));
    showToast('已删除');
    loadOnlinePage(OData.page);
  } catch (e) { /* 错误已由 apiFetch toast */ }
}


const BuildState = { running: false, timer: null, tries: 0, runId: null };
function stopBuildPoll(){
  if (BuildState.timer) { clearInterval(BuildState.timer); BuildState.timer = null; }
  BuildState.running = false;
}

  document.getElementById('content').innerHTML = `

    <p class="page-sub">GitHub Actions 免费 Windows 虚拟机 · 安装 ACE OLEDB → SQLite 重建 → 回读校验 → 上传下载</p>
    <div class="banner-status" style="background:var(--navy);color:#fff;justify-content:space-between;">

        <h2 style="color:#fff;font-size:22px;font-weight:700;margin-bottom:6px;">${online ? '在线生成 · 工作库 db_id=' + API_STATE.dbId : (API_STATE.online ? '请先上传数据库' : '当前为本地模式')}</h2>
        <p style="color:var(--on-dark-muted);font-size:13px;">${online ? (API_STATE.dbName ? '文件 ' + escHtml(API_STATE.dbName) + ' · ' + fmtSize(API_STATE.dbSize) + ' · 触发后约 3-5 分钟完成' : '') : (API_STATE.online ? '后端在线但尚未上传数据库，请先到「数据库接入」上传 .lz / .mdb' : '未连接后端 · 可在本地模式继续浏览演示数据')}</p>
      </div>
      <button class="btn btn-primary" id="buildBtn" onclick="startBuild()" style="height:56px;padding:0 24px;font-size:15px;background:#fff;color:var(--primary);" ${online ? '' : 'disabled'}>触发生成 →</button>
    </div>
    <div style="display:flex;align-items:center;justify-content:center;gap:8px;background:var(--surface-soft);border-radius:12px;padding:20px;margin-top:16px;flex-wrap:wrap;">
      <div style="display:flex;align-items:center;gap:10px;"><span style="width:28px;height:28px;background:var(--success);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:700;">1</span><span style="font-size:13px;font-weight:600;">点触发生成</span></div>
      <span style="color:var(--muted);font-size:14px;">→</span>
      <div style="display:flex;align-items:center;gap:10px;"><span style="width:28px;height:28px;background:var(--success);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:700;">2</span><span style="font-size:13px;font-weight:600;">后端调 GitHub API</span></div>
      <span style="color:var(--muted);font-size:14px;">→</span>
      <div style="display:flex;align-items:center;gap:10px;"><span style="width:28px;height:28px;background:var(--primary);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:700;">3</span><span style="font-size:13px;font-weight:600;">Windows 虚拟机转换 + 校验</span></div>
      <span style="color:var(--muted);font-size:14px;">→</span>

async function startBuild(){
  if (!API_STATE.online) { showToast('本地模式：后端未连接，无法触发 GitHub Actions', 'err'); return; }
  if (!API_STATE.dbId) { showToast('请先到「数据库接入」上传数据库', 'err'); return; }
  if (BuildState.running) return;
  const btn = document.getElementById('buildBtn');
  const log = document.getElementById('buildLog');
  const badge = document.getElementById('buildBadge');
  const actions = document.getElementById('buildActions');
  btn.disabled = true; btn.innerHTML = '生成中…';
  if (actions) actions.style.display = 'none';
  log.innerHTML = '<div>[' + ts() + '] 正在触发构建 POST /api/db/' + API_STATE.dbId + '/build …</div>';
  try {
    const r = await apiPost('/db/' + encodeURIComponent(API_STATE.dbId) + '/build');
    BuildState.running = true; BuildState.tries = 0; BuildState.runId = null;
    log.innerHTML += '<div style="color:var(--success);">[' + ts() + '] ✓ 已触发：' + escHtml((r && r.message) || '后台执行中') + '</div>';
    badge.style.background = 'var(--tint-sky)'; badge.style.color = 'var(--navy)';
    badge.innerHTML = '⏳ 生成中 · 等待 GitHub Actions';
    BuildState.timer = setInterval(buildPollOnce, 10000);
    buildPollOnce();
  } catch (e) {
    log.innerHTML += '<div style="color:var(--error);">[' + ts() + '] ✗ 触发失败：' + escHtml(e.message) + '</div>';
    if (e.status === 500) {
      log.innerHTML += '<div style="color:var(--warning);">[' + ts() + '] 提示：请在后端环境配置 GH_TOKEN（GitHub PAT，需 Actions 权限）后重试；前端不接触任何 token。</div>';
    }
    badge.style.background = 'var(--tint-peach)'; badge.style.color = 'var(--error)';
    badge.innerHTML = '✗ 触发失败';
    btn.disabled = false; btn.innerHTML = '重新触发';
  }
}

async function buildPollOnce(){
  if (!BuildState.running) return;
  BuildState.tries++;
  const log = document.getElementById('buildLog');
  const badge = document.getElementById('buildBadge');
  const btn = document.getElementById('buildBtn');
  const actions = document.getElementById('buildActions');
  if (!log || !badge || !btn) { stopBuildPoll(); return; }
  try {
    const s = await apiGet('/db/' + encodeURIComponent(API_STATE.dbId) + '/build/status', { silent: true });
    const status = (s && s.status) || 'unknown';
    if (s && s.run_id) BuildState.runId = s.run_id;
    if (status === 'success') {
      stopBuildPoll();
      log.innerHTML += '<div style="color:var(--success);">[' + ts() + '] ✓ 构建成功（run #' + (BuildState.runId || '—') + '）· 产物已缓存，可下载</div>';
      badge.style.background = 'var(--tint-mint)'; badge.style.color = 'var(--success)';
      badge.innerHTML = '✓ 已完成 · 生成成功';
      if (actions) actions.style.display = 'flex';
      btn.disabled = false; btn.innerHTML = '重新生成';
    } else if (status === 'failed') {
      stopBuildPoll();
      const failDetail = (s && s.error) ? (' · error: ' + s.error) : (' · conclusion: ' + escHtml((s && s.conclusion) || '—'));
      log.innerHTML += '<div style="color:var(--error);">[' + ts() + '] ✗ 构建失败（run #' + (BuildState.runId || '—') + failDetail + '）</div>';
      log.innerHTML += '<div style="color:var(--steel);">[' + ts() + '] 可到后端日志查看 workflow 详情（gh run view --log-failed）</div>';
      badge.style.background = 'var(--tint-peach)'; badge.style.color = 'var(--error)';
      badge.innerHTML = '✗ 生成失败';
      btn.disabled = false; btn.innerHTML = '重新触发';
    } else {
      if (BuildState.tries >= 120) { // 20 分钟兜底
        stopBuildPoll();
        log.innerHTML += '<div style="color:var(--warning);">[' + ts() + '] 等待超时（20 分钟），任务仍在后台执行，可稍后重新进入本页查看。</div>';
        badge.style.background = 'var(--tint-yellow)'; badge.style.color = 'var(--warning)';
        badge.innerHTML = '⏳ 仍在执行';
        btn.disabled = false; btn.innerHTML = '重新触发';
      } else {
        log.innerHTML += '<div style="color:var(--steel);">[' + ts() + '] 状态：' + escHtml(status) + (BuildState.runId ? ' · run #' + BuildState.runId : '') + ' · 10 秒后再次查询…</div>';
        badge.innerHTML = '⏳ 生成中 · 轮询 ' + BuildState.tries + ' 次';
      }
    }
  } catch (e) {
    stopBuildPoll();
    log.innerHTML += '<div style="color:var(--warning);">[' + ts() + '] 状态查询失败：' + escHtml(e.message) + ' · 已停止自动轮询（可重新触发或刷新页面）</div>';
    badge.innerHTML = '⚠ 状态查询中断';
    btn.disabled = false; btn.innerHTML = '重新触发';
  }
  log.scrollTop = log.scrollHeight;
}

async function downloadArtifact(){
  if (!API_STATE.dbId) return;
  await downloadApiFile('/db/' + encodeURIComponent(API_STATE.dbId) + '/artifact', API_STATE.dbId + '.lz');
}
async function downloadWorkDb(){
  if (!API_STATE.dbId) return;
  await downloadApiFile('/db/' + encodeURIComponent(API_STATE.dbId) + '/download', API_STATE.dbId + '_work.db');
}
function dlStats(f){
  downloadApiFile('/db/' + API_STATE.dbId + '/stats/download?file=' + encodeURIComponent(f), f);
}
function dlDxf(f){
  downloadApiFile('/db/' + API_STATE.dbId + '/dxf/download?file=' + encodeURIComponent(f), f);
}

async function downloadApiFile(path, filename){
  try {
    const res = await apiFetch(path, { silent: true });
    const blob = await res.blob();
    downloadBlob(blob, filename);
    showToast('已下载：' + filename);
  } catch (e) {
    showToast('下载失败：' + e.message, 'err');
  }
}

  document.getElementById('loginUser').value = 'admin';
  document.getElementById('loginPwd').value = 'admin';
}
main();
</script>
