        ${files.map(f => '<div style="padding:8px 12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;"><span>' + escHtml(f) + '</span><button class="btn btn-secondary" style="padding:4px 14px;font-size:12px;color:var(--primary);border-color:var(--primary);" onclick="dlStats(this.dataset.f)" data-f="' + escAttr(f) + '">下载</button></div>').join('')}
      </div>`);
  } catch (e) { showToast('生成失败：' + (e && e.message || e), 'err'); }
}

const OData = { table: null, page: 1, pageSize: 50, keyword: '', searchCol: '', hiddenCols: {}, columns: [], total: 0, debounce: null, orderBy: '', orderDir: '', activeRow: -1, freeze: false };

async function loadOnlinePage(page){
  if (!API_STATE.online || !API_STATE.dbId || !OData.table) return;
  OData.page = Math.max(1, page || 1);
  const si = document.getElementById('onlineSearch');
  if (si) OData.keyword = si.value.trim();
  const sc = document.getElementById('onlineSearchCol');
  if (sc) OData.searchCol = sc.value;
  let q = '/db/' + encodeURIComponent(API_STATE.dbId) + '/table/' + encodeURIComponent(wsRealTable(OData.table))
        + '?page=' + OData.page + '&page_size=' + OData.pageSize;
  if (OData.keyword) q += '&keyword=' + encodeURIComponent(OData.keyword) + '&search_col=' + encodeURIComponent(OData.searchCol) + '&exact=' + (OData.exact ? '1' : '0');
  if (OData.orderBy) q += '&order_by=' + encodeURIComponent(OData.orderBy) + '&order_dir=' + encodeURIComponent(OData.orderDir || 'asc');
  const seq = (OData._seq = (OData._seq || 0) + 1);  // 竞态防护：只渲染最新请求（v45）
  const info = document.getElementById('onlinePgInfo');
  const grid = document.getElementById('onlineGrid');
  if (info) info.textContent = '查询中…';
  if (grid && grid.dataset.loaded === '1') {
    grid.insertAdjacentHTML('beforeend',
      '<div class="skeleton" id="onlineSkeleton">' +
      Array.from({length: 5}, () =>
        '<div class="sk-row">' +
        '<div class="sk-line short"></div>' +
        '<div class="sk-line mid"></div>' +
        '<div class="sk-line short"></div>' +
        '<div class="sk-line long"></div>' +
        '<div class="sk-line short"></div>' +
        '<div class="sk-line short"></div>' +
        '</div>'
      ).join('') + '</div>');
  }
  try {
    const r = await apiGet(q);
    if (seq !== OData._seq) return;  // 过期请求丢弃
    OData.columns = r.columns || [];
    OData.total = r.total || 0;
    renderOnlineRows(r.rows || [], r);
    if (grid) grid.dataset.loaded = '1';
    refreshUndoButton();  // D2：按服务端撤销栈状态显示/隐藏撤销按钮
  } catch (e) {
    if (seq !== OData._seq) return;
    if (info) info.textContent = '查询失败：' + escHtml(e.message);
    const sk = document.getElementById('onlineSkeleton');
    if (sk) sk.remove();
  }
}

function inlineEdit(cell, rowId, col){
  if (!can('data_edit')) return;
  if (cell.dataset.editing) return;
  const old = cell.textContent;
  cell.dataset.editing = '1';
  const inp = document.createElement('input');
  inp.type = 'text'; inp.value = old;
  inp.style.cssText = 'width:100%;border:none;outline:none;font-size:12.5px;background:transparent;color:var(--ink);';
  cell.textContent = '';
  cell.appendChild(inp);
  inp.focus(); inp.select();
  const finish = async (save) => {
    cell.dataset.editing = '';
    if (!save) { cell.textContent = old; return; }
    const val = inp.value;
    cell.textContent = val;
    try {
      await apiPut('/db/' + API_STATE.dbId + '/table/' + encodeURIComponent(wsRealTable(OData.table)) + '/' + rowId,
                   { data: (function(){ var d = {}; d[col] = val; return d; })() });
      showToast('已保存', 'info');
      loadOnlinePage(OData.page);
    } catch (e) { cell.textContent = old; showToast('保存失败：' + ((e && e.message) || e), 'err'); }
  };
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') finish(true); if (e.key === 'Escape') finish(false); });
  inp.addEventListener('blur', () => finish(true));
}

function cyChange(sel, rowId){
  if (!can('data_edit')) { showToast('当前角色无编辑权限','err'); return; }
  const v = sel.value === '1' ? 1 : 0;
  apiPut('/db/' + API_STATE.dbId + '/table/' + encodeURIComponent(wsRealTable(OData.table)) + '/' + rowId,
         { data: { CY: v } })
    .then(() => { showToast('已保存：' + (v ? '参与' : '不参与'), 'info'); loadOnlinePage(OData.page); })
    .catch(e => { showToast('保存失败：' + ((e && e.message) || e), 'err'); });
}

function renderOnlineRows(rows){
  OData.rowCache = {};
  const sk = document.getElementById('onlineSkeleton');
  if (sk) sk.remove();
  const tbl = OData.table || '';
  const all = (OData.columns || []).filter(c => c !== 'id');
  const hidden = OData.hiddenCols[tbl] || {};
  let cols = (WS_COLS[tbl] ? WS_COLS[tbl].filter(c => all.includes(c)) : all)
    .filter(c => !hidden[c]);
  if (cols.includes('TCMC') && cols.includes('TCYMC')) {
    cols = cols.filter(c => c !== 'TCYMC');
  }
  const grid = document.getElementById('onlineGrid');
  const info = document.getElementById('onlinePgInfo');
  const totalPages = Math.max(1, Math.ceil(OData.total / OData.pageSize));
  if (info) info.textContent = '共 ' + OData.total + ' 条 · 第 ' + OData.page + ' / ' + totalPages + ' 页' + (OData.keyword ? ' · 关键词「' + OData.keyword + '」' : '');
  const prev = document.getElementById('onlinePrev'), next = document.getElementById('onlineNext');
  if (prev) prev.disabled = OData.page <= 1;
  if (next) next.disabled = OData.page >= totalPages;
  const colW = (c) => (COL_WIDTH[c] || (WS_COL_WIDE.includes(c) ? 120 : 90)) + 'px';
  const colFlexible = (c) => (c === 'TCMS' || c === 'QYDC');
  const gridColsReal = [COL_WIDTH['#'] + 'px']
    .concat(cols.map(c => colFlexible(c) ? 'minmax(' + colW(c) + ',260px)' : 'minmax(' + colW(c) + ',1fr)'))
    .concat([COL_OP_W + 'px']).join(' ');
  const minW = cols.reduce((s, c) => s + (COL_WIDTH[c] || (WS_COL_WIDE.includes(c) ? 120 : 90)), 0) + COL_WIDTH['#'] + COL_OP_W;
  const numCols = {};
  if (rows.length) {
    cols.forEach(c => {
      const vals = rows.slice(0, 20).map(r => r[c]).filter(v => v !== null && v !== undefined && v !== '');
      if (vals.length && vals.every(v => typeof v === 'number' || (typeof v === 'string' && /^-?\d+(\.\d+)?$/.test(v.trim())))) numCols[c] = true;
    });
  }
  const isStrata = tbl === 'z_g_TuCeng';
  const layerNoOf = (row) => {
    if (!isStrata) return null;
    const m = row.TCZCBH, s = row.TCYCBH;
    if (m === null || m === undefined || m === '') return null;
    return String(m) + '-' + (s === null || s === undefined || s === '' ? '0' : String(s));
  };
  const DEPTH_COL = { 'z_g_TuCeng':'TCCDSD', 'z_c_QuYang':'QYSD', 'z_c_QuYang__kf':'QYSD', 'z_y_BiaoGuan':'BGDSD', 'z_y_DongTan':'DTDSD', 'z_g_ShuiWei':'SWSD' };
  const dcol = DEPTH_COL[tbl];
  let renderRows = rows;
  if (dcol && !OData.orderBy) {
    renderRows = rows.slice().sort((a, b) => {
      const za = String(a.ZKBH || ''), zb = String(b.ZKBH || '');
      if (za !== zb) return za.localeCompare(zb, 'zh-Hans-CN', { numeric: true });
      const da = (a[dcol] === null || a[dcol] === undefined || a[dcol] === '') ? Infinity : Number(a[dcol]);
      const db = (b[dcol] === null || b[dcol] === undefined || b[dcol] === '') ? Infinity : Number(b[dcol]);
      return da - db;
    });
  }
  const head = '<div class="t-head" style="grid-template-columns:' + gridColsReal + ';min-width:' + minW + 'px;position:sticky;top:0;z-index:3;box-shadow:0 1px 0 var(--hairline);">' +
    '<div' + (OData.freeze ? ' class="cell-fixed" style="left:20px;"' : '') + '>#</div>' +
    cols.map((c, ci) => {
      const sorted = OData.orderBy === c;
      const cn = escHtml(COLUMN_CN[c] || c);
      const ind = sorted ? '<span style="font-size:10px;margin-left:2px;">' + (OData.orderDir === 'desc' ? '↓' : '↑') + '</span>' : '<span class="col-act" style="font-size:10px;margin-left:2px;">⇅</span>';
      return '<div class="' + (OData.freeze && ci === 0 ? 'cell-fixed' : '') + '" style="display:flex;align-items:center;justify-content:center;gap:5px;' + (OData.freeze && ci === 0 ? 'left:80px;' : '') + '">' +
        '<span class="col-sort' + (sorted ? ' sorted' : '') + '" style="flex:1;min-width:0;" title="' + (sorted ? '点击切换排序方向' : '点击排序') + '" onclick="sortBy(\'' + escJs(c) + '\')"><span style="display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom;">' + cn + '</span>' + ind + '</span>' +
        '<span class="col-act" style="cursor:pointer;font-size:12px;" title="按此列筛选" onclick="filterBy(\'' + escJs(c) + '\')">⌕</span>' +
      '</div>';
    }).join('') +
    '<div>操作</div></div>';
  let lastZk = null, seqInHole = 0;
  const body = renderRows.length ? renderRows.map((row, ri) => {
    const idJs = JSON.stringify(row.id == null ? '' : row.id).replace(/"/g, '');
    OData.rowCache[String(row.id)] = row;
    const activeCls = ri === OData.activeRow ? ' cell-active' : '';
    const zk = String(row.ZKBH || '');
    if (zk !== lastZk) { seqInHole = 1; lastZk = zk; } else { seqInHole++; }
    const seqVal = seqInHole;
    return '<div class="t-row' + activeCls + '" style="grid-template-columns:' + gridColsReal + ';min-width:' + minW + 'px;' + (ri % 2 ? 'background:rgba(0,0,0,.015);' : '') + '" onclick="OData.activeRow=' + ri + ';paintActiveRow()">' +
      '<div class="muted' + (OData.freeze ? ' cell-fixed' : '') + '"' + (OData.freeze ? ' style="left:20px;"' : '') + ' title="孔内序号">' + escHtml(seqVal) + '</div>' +
      cols.map((c, ci) => {
        const cls = (OData.freeze && ci === 0 ? ' cell-fixed' : '') + (WS_COL_WIDE.includes(c) ? ' cell-clamp' : '');
        const stl = (OData.freeze && ci === 0 ? 'left:80px;' : '') + 'cursor:pointer;text-align:center;' + (numCols[c] ? 'font-variant-numeric:tabular-nums;' : '');
        if (c === 'CY') {
          const on = row[c] === 1 || row[c] === '1' || row[c] === '参与';
          return '<div style="' + (OData.freeze && ci === 0 ? 'left:80px;' : '') + 'text-align:center;">' +
            '<select data-row="' + idJs + '" onchange="cyChange(this,' + idJs + ')" ' + (can('data_edit') ? '' : 'disabled') +
            ' style="height:26px;border:1px solid var(--hairline-strong);border-radius:8px;font-size:12px;padding:0 4px;background:#fff;color:var(--ink);cursor:pointer;">' +
            '<option value="1"' + (on ? ' selected' : '') + '>参与</option>' +
            '<option value="0"' + (on ? '' : ' selected') + '>不参与</option></select></div>';
        }
        if (c === 'TCXH' && isStrata) {
          const lno = layerNoOf(row);
          return '<div class="' + cls.trim() + '" style="' + stl + '" title="主层号-亚层号 · 点击编辑" onclick="inlineEdit(this, ' + idJs + ', \'' + escJs(c) + '\')">' + escHtml(lno == null ? '—' : lno) + '</div>';
        }
        const val = row[c] === null || row[c] === undefined || row[c] === '' ? '<span class="muted">—</span>' : escHtml(fmtNum(row[c]));
        const tip = WS_COL_WIDE.includes(c) ? escAttr(row[c] == null ? '' : String(row[c])) + ' · 点击编辑' : '点击编辑';
        return '<div class="' + cls.trim() + '" style="' + stl + '" title="' + tip + '" onclick="inlineEdit(this, ' + idJs + ', \'' + escJs(c) + '\')">' + val + '</div>';
      }).join('') +
      '<div>' +
        (can('data_delete') ? '<a class="btn-link" style="color:var(--error)" href="javascript:delOnlineRow(' + idJs + ')">删除</a>' : '') +
      '</div></div>';
  }).join('') : '<div style="padding:32px;text-align:center;color:var(--steel);">' + (OData.keyword ? '无匹配结果' : '暂无数据') + '</div>';
  if (grid) grid.innerHTML = '<div style="min-width:100%;">' + head + body + '</div>';
  bindGridKeys();
}

function sortBy(c){
  if (OData.orderBy === c) {
    if (OData.orderDir === 'asc') OData.orderDir = 'desc';
    else if (OData.orderDir === 'desc') { OData.orderBy = ''; OData.orderDir = ''; }
    else { OData.orderBy = c; OData.orderDir = 'asc'; }
  } else { OData.orderBy = c; OData.orderDir = 'asc'; }
  loadOnlinePage(1);
}
function filterBy(c){
  const cur = (OData.searchCol === c && OData.keyword) ? OData.keyword : '';
  const html = '<div style="padding:18px 22px;max-width:440px;">' +
    '<div style="font-size:14px;font-weight:600;margin-bottom:4px;">按「' + escHtml(COLUMN_CN[c] || c) + '」筛选</div>' +
    '<p style="margin:0 0 12px;font-size:12px;color:var(--muted);">模糊匹配该列，可与排序叠加；不输入直接应用则清除该列筛选。</p>' +
    '<input id="filterInput" placeholder="输入关键词…" value="' + escAttr(cur) + '" style="width:100%;height:38px;border:1px solid var(--hairline-strong);border-radius:10px;padding:0 12px;font-size:13px;box-sizing:border-box;">' +
    '<div style="display:flex;gap:10px;margin-top:14px;">' +
      '<button class="btn btn-primary" onclick="filterApply(\'' + escJs(c) + '\', true)">应用</button>' +
      '<button class="btn btn-secondary" onclick="filterApply(\'' + escJs(c) + '\', false)">清除该列</button>' +
      '<button class="btn btn-secondary" onclick="closeModal()">取消</button>' +
    '</div></div>';
  openModal('列筛选 · ' + (COLUMN_CN[c] || c), html);
  setTimeout(() => { const i = document.getElementById('filterInput'); if (i) i.focus(); }, 50);
}
function filterApply(c, apply){
  const kw = apply ? (document.getElementById('filterInput') ? document.getElementById('filterInput').value.trim() : '') : '';
  OData.searchCol = kw ? c : '';
  OData.keyword = kw;
  OData.exact = false;
  OData.page = 1;
  const si = document.getElementById('onlineSearch');
  if (si) si.value = kw;
  closeModal();
  loadOnlinePage(1);
}
function bindGridKeys(){
  const grid = document.getElementById('onlineGrid');
  if (!grid || grid.dataset.kb) return;
  grid.dataset.kb = '1';
  grid.tabIndex = 0;
  grid.addEventListener('keydown', e => {
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT')) return;
    const rows = Array.from(grid.querySelectorAll('.t-row'));
    if (!rows.length) return;
    if (e.key === 'Escape') { OData.activeRow = -1; paintActiveRow(); return; }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (OData.activeRow < 0) OData.activeRow = 0;
      else OData.activeRow = Math.min(rows.length - 1, Math.max(0, OData.activeRow + (e.key === 'ArrowDown' ? 1 : -1)));
      paintActiveRow();
      rows[OData.activeRow].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter' && OData.activeRow >= 0) {
      e.preventDefault();
      const cell = rows[OData.activeRow].querySelector('div[onclick*="inlineEdit"]');
      if (cell) cell.click();
    }
  });
}
function paintActiveRow(){
  const grid = document.getElementById('onlineGrid');
  if (!grid) return;
  grid.querySelectorAll('.t-row').forEach((r, i) => r.classList.toggle('cell-active', i === OData.activeRow));
}

async function delOnlineRow(id){
  if (!can('data_delete')) return showToast('当前角色无删除权限', 'err');
  if (!confirm('确认删除该条数据？删除后不可恢复。')) return;
  try {
    await apiDelete('/db/' + encodeURIComponent(API_STATE.dbId) + '/table/' + encodeURIComponent(wsRealTable(OData.table)) + '/' + encodeURIComponent(id));
    showToast('已删除');
    loadOnlinePage(OData.page);
  } catch (e) {}
}

// ---- D2/A3：新增行 + 批量撤销（服务端单事务 + 回读校验） ----
async function addOnlineRow(){
  if (!can('data_edit')) return showToast('当前角色无编辑权限', 'err');
  const tbl = wsRealTable(OData.table);
  if (!tbl) return showToast('请先选择数据表', 'err');
  const cols = (OData.columns || []).filter(c => c !== 'id');
  if (!cols.length) return showToast('无可用列', 'err');
  // 以当前行(或空)为模板，钻孔编号列 ZKBH 自动继承，深度类列留空待填
  const tpl = {};
  const curRow = OData.rowCache && Object.values(OData.rowCache)[0];
  if (curRow && curRow.ZKBH) tpl.ZKBH = curRow.ZKBH;
  const data = {};
  cols.forEach(c => { data[c] = tpl[c] !== undefined ? tpl[c] : null; });
  if (!confirm('在「' + (COLUMN_CN[tbl] || tbl) + '」新增一行（空行，钻孔编号已继承 ' + (tpl.ZKBH || '—') + '）？\n提交后立即写库，可用「撤销上次批量」回退。')) return;
  try {
    const r = await apiPost('/db/' + encodeURIComponent(API_STATE.dbId) + '/batch', {
      ops: [{ op: 'insert', table: tbl, data: data }],
      verify: true
    });
    showToast('已新增 1 行（回读校验通过）', 'info');
    refreshUndoButton();
    loadOnlinePage(OData.page);
  } catch (e) {}
}

async function undoLastBatch(){
  if (!can('data_edit')) return showToast('当前角色无编辑权限', 'err');
  if (!confirm('撤销最近一次批量保存（恢复全部原始值）？')) return;
  try {
    const r = await apiPost('/db/' + encodeURIComponent(API_STATE.dbId) + '/undo', {});
    showToast('已撤销 ' + (r.applied || 0) + ' 条操作', 'info');
    refreshUndoButton();
    loadOnlinePage(OData.page);
  } catch (e) {}
}

async function refreshUndoButton(){
  const btn = document.getElementById('btnUndoBatch');
  if (!btn || !API_STATE.dbId) return;
  try {
    const r = await apiGet('/db/' + encodeURIComponent(API_STATE.dbId) + '/undo/status', { silent: true });
    btn.style.display = (r && r.can_undo) ? '' : 'none';
  } catch (e) { btn.style.display = 'none'; }
}

        <div class="ic-circle"><svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M12 4v11m0 0 4-4m-4 4-4-4" stroke="#221a08" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 16v2.5A2.5 2.5 0 0 0 6.5 21h11a2.5 2.5 0 0 0 2.5-2.5V16" stroke="#221a08" stroke-width="2.2" stroke-linecap="round"/></svg></div>
      </div>
    </div>
    <div class="table-card" style="padding:20px;">
      <div class="stat-head" style="justify-content:space-between;margin-bottom:14px;display:flex;align-items:center;">
        <h3 style="font-size:14.5px;font-weight:800;" id="buildTaskTitle">当前任务 ${online ? '· db_id=' + API_STATE.dbId : '（未开始）'}</h3>
        <span id="buildBadge" style="display:inline-flex;align-items:center;gap:6px;background:var(--surface);color:var(--steel);font-size:12px;font-weight:700;padding:6px 13px;border-radius:999px;border:1px solid var(--hairline);">等待触发</span>
      </div>
      <div id="buildLog" style="background:var(--surface-soft);border:1px solid var(--hairline);border-radius:12px;padding:16px;font-family:var(--font-num);font-size:12px;color:var(--slate);line-height:2;max-height:240px;overflow-y:auto;">
        <div>${online ? '点击「触发生成」开始' : '本地模式无法触发构建，请先上传数据库'}</div>
      </div>
      <div class="build-actions" id="buildActions" style="display:none;">
        <button class="btn btn-primary" onclick="downloadArtifact()">下载 .lz 产物</button>
        <button class="btn btn-secondary" onclick="downloadWorkDb()">下载 work.db</button>
      </div>
    </div>
  `;
  if (BuildState.running) {
    const badge = document.getElementById('buildBadge');
    const log = document.getElementById('buildLog');
    const btn = document.getElementById('buildBtn');
    if (badge) { badge.style.background = 'var(--tint-sky)'; badge.style.color = 'var(--navy)'; badge.innerHTML = '⏳ 生成中 · 已触发（恢复轮询…）'; }
    if (log) log.innerHTML += '<div>[' + ts() + '] 任务进行中，继续轮询 /build/status（每 10 秒）…</div>';
    if (btn) { btn.disabled = true; btn.innerHTML = '生成中…'; }
  }
}

async function startBuild(){
  if (!API_STATE.online) { showToast('本地模式：后端未连接，无法触发 GitHub Actions', 'err'); return; }
  if (!API_STATE.dbId) { showToast('请先到「数据库接入」上传数据库', 'err'); return; }
  if (BuildState.running) return;
  const btn = document.getElementById('buildBtn');
  const log = document.getElementById('buildLog');
  const badge = document.getElementById('buildBadge');
  const actions = document.getElementById('buildActions');
  btn.disabled = true; btn.innerHTML = '生成中…';
  if (actions) actions.style.display = 'none';
  log.innerHTML = '<div>[' + ts() + '] 正在触发构建 POST /api/db/' + API_STATE.dbId + '/build（channel=auto，后端按能力选本地/GitHub 通道）…</div>';
  try {
    const r = await apiPost('/db/' + encodeURIComponent(API_STATE.dbId) + '/build', {});
    BuildState.running = true; BuildState.tries = 0; BuildState.runId = null;
    BuildState.channel = (r && r.channel) || 'auto';
    log.innerHTML += '<div style="color:var(--success);">[' + ts() + '] ✓ 已触发（通道: ' + escHtml(BuildState.channel) + '）：' + escHtml((r && r.message) || '后台执行中') + '</div>';
    badge.style.background = 'var(--tint-sky)'; badge.style.color = 'var(--navy)';
    badge.innerHTML = '⏳ 生成中 · ' + (BuildState.channel === 'local' ? '本地重建' : 'GitHub Actions');
    BuildState.timer = setInterval(buildPollOnce, BuildState.channel === 'local' ? 3000 : 10000);
    buildPollOnce();
  } catch (e) {
    log.innerHTML += '<div style="color:var(--error);">[' + ts() + '] ✗ 触发失败：' + escHtml(e.message) + '</div>';
    if (e.status === 500) {
      log.innerHTML += '<div style="color:var(--warning);">[' + ts() + '] 提示：请在后端环境配置 GH_TOKEN（GitHub PAT，需 Actions 权限）后重试；前端不接触任何 token。</div>';
    }
    badge.style.background = 'var(--tint-peach)'; badge.style.color = 'var(--error)';
    badge.innerHTML = '✗ 触发失败';
    btn.disabled = false; btn.innerHTML = '重新触发';
  }
}

async function buildPollOnce(){
  if (!BuildState.running) return;
  BuildState.tries++;
  const log = document.getElementById('buildLog');
  const badge = document.getElementById('buildBadge');
  const btn = document.getElementById('buildBtn');
  const actions = document.getElementById('buildActions');
  if (!log || !badge || !btn) { stopBuildPoll(); return; }
  try {
    const s = await apiGet('/db/' + encodeURIComponent(API_STATE.dbId) + '/build/status', { silent: true });
    const status = (s && s.status) || 'unknown';
    if (s && s.run_id) BuildState.runId = s.run_id;
    if (status === 'success') {
      stopBuildPoll();
      log.innerHTML += '<div style="color:var(--success);">[' + ts() + '] ✓ 构建成功（run #' + (BuildState.runId || '—') + '）· 产物已缓存，可下载</div>';
      badge.style.background = 'var(--tint-mint)'; badge.style.color = 'var(--success)';
      badge.innerHTML = '✓ 已完成 · 生成成功';
      if (actions) actions.style.display = 'flex';
      btn.disabled = false; btn.innerHTML = '重新生成';
    } else if (status === 'failed') {
      stopBuildPoll();
      const failDetail = (s && s.error) ? (' · error: ' + s.error) : (' · conclusion: ' + escHtml((s && s.conclusion) || '—'));
      log.innerHTML += '<div style="color:var(--error);">[' + ts() + '] ✗ 构建失败（run #' + (BuildState.runId || '—') + failDetail + '）</div>';
      log.innerHTML += '<div style="color:var(--steel);">[' + ts() + '] 可到后端日志查看 workflow 详情（gh run view --log-failed）</div>';
      badge.style.background = 'var(--tint-peach)'; badge.style.color = 'var(--error)';
      badge.innerHTML = '✗ 生成失败';
      btn.disabled = false; btn.innerHTML = '重新触发';
    } else {
      if (BuildState.tries >= 120) {
        stopBuildPoll();
        log.innerHTML += '<div style="color:var(--warning);">[' + ts() + '] 等待超时（20 分钟），任务仍在后台执行，可稍后重新进入本页查看。</div>';
        badge.style.background = 'var(--tint-yellow)'; badge.style.color = 'var(--warning)';
        badge.innerHTML = '⏳ 仍在执行';
        btn.disabled = false; btn.innerHTML = '重新触发';
      } else {
        log.innerHTML += '<div style="color:var(--steel);">[' + ts() + '] 状态：' + escHtml(status) + (BuildState.runId ? ' · run #' + BuildState.runId : '') + ' · 10 秒后再次查询…</div>';
        badge.innerHTML = '⏳ 生成中 · 轮询 ' + BuildState.tries + ' 次';
      }
    }
  } catch (e) {
    stopBuildPoll();
    log.innerHTML += '<div style="color:var(--warning);">[' + ts() + '] 状态查询失败：' + escHtml(e.message) + ' · 已停止自动轮询（可重新触发或刷新页面）</div>';
    badge.innerHTML = '⚠ 状态查询中断';
    btn.disabled = false; btn.innerHTML = '重新触发';
  }
  log.scrollTop = log.scrollHeight;
}

async function downloadArtifact(){
  if (!API_STATE.dbId) return;
  await downloadApiFile('/db/' + encodeURIComponent(API_STATE.dbId) + '/artifact', API_STATE.dbId + '.lz');
}
async function downloadWorkDb(){
  if (!API_STATE.dbId) return;
  await downloadApiFile('/db/' + encodeURIComponent(API_STATE.dbId) + '/download', API_STATE.dbId + '_work.db');
}
function dlCadReport(f){
  downloadApiFile('/db/' + API_STATE.dbId + '/cad-check/report?file=' + encodeURIComponent(f), f);
}

function dlStats(f){
  downloadApiFile('/db/' + API_STATE.dbId + '/stats/download?file=' + encodeURIComponent(f), f);
}
function dlDxf(f){
  downloadApiFile('/db/' + API_STATE.dbId + '/dxf/download?file=' + encodeURIComponent(f), f);
}

async function downloadApiFile(path, filename){
  try {
    const res = await apiFetch(path, { silent: true });
    const blob = await res.blob();
    downloadBlob(blob, filename);
    showToast('已下载：' + filename);
  } catch (e) {
    showToast('下载失败：' + e.message, 'err');
  }
}

async function main(){
  loadApiState();
  detectBackend();
  document.getElementById('loginUser').value = 'admin';
  document.getElementById('loginPwd').value = 'admin';
}
main();
</script>
