# ================================
# B类软土分类（TB10012 铁路规范）
# ================================
# 【软土必要条件】（V3.0.3 Agent1-6）：e≥1.0 且 hsl>yx（天然含水率>液限）——依据
# GB 50021-2001 第6.3.1条 / 知识库《岩土指标测试、统计与图表》："软土指天然孔隙比
# 大于等于1.0，且天然含水量大于液限的细粒土，包含淤泥、淤泥质土、泥炭、泥炭质土等"。
# 不满足必要条件即非软土，直接不归入任何子类（原"需要满足条件数=2 三选二"可使
# w<wL 误判软土，已废止；该键保留仅为历史配置兼容，不再参与判定）。
# 必要条件满足后，按 wu/e 区间细分 5 个子类：
#   ① 有机质含量 wu(%) 在范围内（子类分档：软黏性土 <3 / 淤泥质土、淤泥 3~10 / 泥炭质土 10~60 / 泥炭 >60）
#   ② 天然孔隙比 e 在范围内（淤泥质土 1.0≤e<1.5 / 淤泥 e≥1.5 / 泥炭质土 3≤e<10 / 泥炭 e≥10）
# 区间按【半开语义 [min,max)】归属、边界归上档（V3.0.3 Agent1-7：wu=3→淤泥质土、e=1.5→淤泥），
# 最后一个子类（泥炭）上界为自然上限（wu=100 / e 无上界）含端点。
# 也可用于判定岩土名称是否与试验指标一致

