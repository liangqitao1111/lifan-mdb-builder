services:
  lifan-web:
    build: .
    container_name: lifan-web
    ports:
      - "8000:8000"
    environment:
      # 触发 GitHub Actions 构建 MDB 的 token（必填，否则构建按钮报错）
      - GH_TOKEN=${GH_TOKEN:-}
      # 登录凭据必须由部署环境显式提供，避免公开默认账号。
      - ADMIN_USER=${ADMIN_USER:?ADMIN_USER must be set in .env}
      - ADMIN_PASS=${ADMIN_PASS:?ADMIN_PASS must be set in .env}
      # 鉴权签名密钥必须由部署环境显式提供，且应使用随机长字符串。
      - AUTH_SECRET=${AUTH_SECRET:?AUTH_SECRET must be set in .env}
      # 反向代理地址（可选，逗号分隔 IP/CIDR）；未配置时忽略 X-Forwarded-For。
      - TRUSTED_PROXY_IPS=${TRUSTED_PROXY_IPS:-}
    volumes:
      # 上传库/工作库/产物持久化
      - lifan_work:/app/work
    restart: unless-stopped

volumes:
  lifan_work:
